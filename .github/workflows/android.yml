name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # A stable key is what lets an update install over the copy already on a
      # phone. Without one, every run signs with a fresh throwaway key and
      # Android refuses the upgrade.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.NCM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ncm.p12"
            echo "NCM_KEYSTORE=$RUNNER_TEMP/ncm.p12" >> "$GITHUB_ENV"
            echo "signing with the stored key"
          else
            echo "::warning::no stored signing key — this APK will not install over an existing one"
          fi

      - name: Build release APK
        working-directory: android
        env:
          NCM_KEYSTORE_PASSWORD: ${{ secrets.NCM_KEYSTORE_PASSWORD }}
          NCM_KEY_ALIAS: ncm
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/NCM-Permission.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Permission-APK
          path: out/NCM-Permission.apk
          if-no-files-found: error

      # A fixed "latest-apk" release keeps the download link stable, which is far
      # easier on a phone than digging an artifact out of an Actions run.
      # Only a correctly signed build may replace the download everyone uses:
      # an APK signed by any other key cannot install over the one on a phone.
      - name: Publish to latest-apk release
        if: env.NCM_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          body: |
            أحدث نسخة من تطبيق NCM Permission (أندرويد).
            اتبنت من commit ${{ github.sha }}.
          files: out/NCM-Permission.apk
          prerelease: true
