name: Build Android APK

# The app is a window onto the published site, so a change to the site needs no
# build at all - only a change to the wrapper itself does.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/NCM-Permission.apk

      # The release below is where the APK actually lives, so this copy is only
      # a guard: if-no-files-found makes the build fail loudly when gradle
      # produced nothing. One day is long enough for that - left at the default
      # 90, every build piled up another copy of an APK already published.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Permission-APK
          path: out/NCM-Permission.apk
          if-no-files-found: error
          retention-days: 1

      # NOT the download link the phones use. This build is signed with the
      # runner's debug key, which is generated fresh on every runner — so every
      # build carries a different key, and Android refuses to install one over
      # another: the only way past is to uninstall, which wipes the saved PIN.
      #
      # The APK the phones install lives on "latest-apk" and is signed by hand
      # with the permanent key (.ncm-secrets\ncm-android-signing.p12, SHA-256
      # caa0f998…). The GitHub token cannot write Actions secrets, so the key
      # cannot live here. This step only parks the build where it can be picked
      # up, re-signed, and published to latest-apk from the desktop.
      - name: Publish to ci-build release (re-sign before distributing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build
          name: CI build — not for phones until re-signed
          body: |
            بناء تلقائي من commit ${{ github.sha }} — متوقّع بمفتاح debug عشوائي.
            **متتثبتش على الموبايلات.** لازم يتوقّع بالمفتاح الدائم ويترفع على latest-apk.
          files: out/NCM-Permission.apk
          prerelease: true
