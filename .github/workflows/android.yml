name: Build Android APK

# The app is a window onto the published site, so a change to the site needs no
# build at all - only a change to the wrapper itself does.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/NCM-Permission.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Permission-APK
          path: out/NCM-Permission.apk
          if-no-files-found: error

      # Publishes to a fixed "latest-apk" release so the APK always has the same
      # download link — easier than digging through Actions artifacts on a phone.
      - name: Publish to latest-apk release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          body: |
            أحدث نسخة من تطبيق NCM Permission.
            اتبنت من commit ${{ github.sha }}.
          files: out/NCM-Permission.apk
          prerelease: true
