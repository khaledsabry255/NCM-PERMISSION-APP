<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCM PERMISSION — بحث متكرر</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#edf2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="../supabase.min.js"></script>
<script src="../lib/papaparse.min.js"></script>
<style>
/* ============================================================
   THE LIST SEARCH — the third system.
   A whole list in one go: a national id, a code or a name on each line (or a
   plate on each line), answered a line at a time out of BOTH sources at once -
   the employees table and the permits sheet. What it DOES is the search of the
   desk system (Khaled's NCM SYSTEM): the same way of reading the list and the
   same rules for who a line finds. What it LOOKS like is this app and nothing
   else - the desk's wide table of fifteen columns is no use on a phone, so
   each answer is a short row and the rest is in the card behind it.

   It is a file of its own on purpose, like the other two systems: it borrows
   their rules by copying them, and shares no name with either.
   The colours and the type are the employees system's.
   ============================================================ */
:root{
  --bg:#edf2f8;
  --panel:#ffffff;
  --panel-2:#f3f7fb;
  --blue:#1565c0;
  --blue-soft:#1e75d6;
  --tint:#e6eef8;
  --card:rgba(182,213,247,.42);
  --card-line:#c9d9ea;
  --brand-green:#4ba548;
  --brand-blue:#1565c0;
  --navy:#1f4e79;
  --brand-grey:#4a5a6b;
  --ok:#12874f;    --ok-bg:#dff3e7;    --ok-br:#8fd3ae;
  --warn:#b96e08;  --warn-bg:#fcebd5;  --warn-br:#efc383;
  --bad:#c22f2f;   --bad-bg:#fbe3e3;   --bad-br:#efa9a9;
  --ban:#a31515;
  --mute:#4a5a6b;  --mute-bg:#edf0f3;  --mute-br:#cbd3db;
  /* this system's own colour on the home screen: a mid yellow */
  --sun:#f2bf3f;   --sun-deep:#d99c14;
  --text:#0b1114;
  --text-2:#2a3238;
  --muted:#3b4a5c;
  --line:#e2e9f2;
  --line-2:#c0d3ec;
  --r-sm:10px;
  --r:14px;
  --r-lg:18px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cond:'Barlow Condensed',sans-serif;
  --sans:'Tajawal',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 460px at 50% -10%, rgba(21,101,192,.09) 0%, transparent 62%),
    radial-gradient(680px 420px at 12% 42%, rgba(242,191,63,.10) 0%, transparent 64%),
    radial-gradient(760px 520px at 92% 88%, rgba(21,101,192,.07) 0%, transparent 66%);
  background-repeat:no-repeat;background-attachment:fixed;
  min-height:100dvh;
}
body{
  background:transparent;color:var(--text);font-family:var(--sans);font-weight:500;
  min-height:100dvh;padding-bottom:calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  /* Tajawal swaps digits to Arabic-Indic forms while the page language is
     Arabic; turning off the localised forms keeps every number Western. */
  font-feature-settings:"locl" 0;
  font-variant-numeric:lining-nums;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;display:inline-block;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}

/* ---------- shell ---------- */
.topbar{padding:calc(24px + env(safe-area-inset-top)) 20px 2px;text-align:center;}
.shell{max-width:760px;margin:0 auto;padding:0 14px;}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1;}
.ncm{
  font-family:var(--sans),'Arial Black',system-ui;font-weight:900;font-size:32px;line-height:1;
  color:var(--brand-blue);direction:ltr;unicode-bidi:isolate;
}
.ncm i{font-style:normal;color:var(--brand-green);}
.ncm b{font-weight:inherit;color:var(--brand-grey);}
.tagline{font-size:10.5px;letter-spacing:.17em;text-indent:.17em;color:var(--navy);margin-top:9px;direction:ltr;unicode-bidi:isolate;}
.brand .hr{display:block;width:46px;height:1px;margin:10px auto 8px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);}
.appname{font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.13em;text-indent:.13em;line-height:1;color:var(--blue);}
.pagename{
  display:inline-block;margin-top:11px;padding:5px 16px;border-radius:999px;
  background:var(--sun);border:1px solid var(--sun-deep);color:#3b2a04;
  font-size:13.5px;font-weight:800;
}

/* ---------- the list box ---------- */
.multi-box{position:relative;display:flex;flex-direction:column;gap:10px;margin-top:14px;animation:fadeUp .4s ease-out backwards;}
/* --mono ends in the generic "monospace", which answers for Arabic before
   Tajawal ever gets asked — so the stack is spelled out here instead. */
.multi-ta{
  display:block;width:100%;min-height:132px;max-height:38vh;resize:none;padding:11px 15px;text-align:center;
  border-radius:var(--r-lg);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);
  font-family:'IBM Plex Mono','Tajawal','Segoe UI',Tahoma,sans-serif;
  font-size:16px;font-weight:600;line-height:1.9;outline:none;
  /* each line takes its own direction: a number reads left to right, a name right to left */
  unicode-bidi:plaintext;
  transition:border-color .18s,box-shadow .18s;
}
.multi-ta:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.10);}
.multi-ta::placeholder{font-family:var(--sans);font-weight:500;color:var(--muted);}
/* Two rows on a phone: which sheet and how many lines, then the two buttons
   and the history arrow. Every piece has a width of its own rather than its
   word's, so «بحث» and "Search" do not shuffle the row. */
.multi-bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--panel-2);}
.seg button{border:none;background:none;width:86px;padding:8px 0;font-size:13.5px;font-weight:800;color:var(--muted);transition:background .14s,color .14s;}
.seg button.on{background:var(--blue);color:#fff;}
.multi-n{width:92px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);}
.rowbreak{flex-basis:100%;height:0;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--tint);color:var(--blue);font-size:14.5px;font-weight:800;
  transition:background .16s,transform .12s,filter .16s;
}
.btn:active{transform:scale(.96);}
.btn.primary{flex:1;min-width:150px;padding-block:13px;font-size:15.5px;background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(21,101,192,.24);}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:var(--r-sm);}
.btn[disabled]{opacity:.55;cursor:default;}
.fab{
  flex:none;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);background:var(--tint);color:var(--blue);
  transition:background .16s,transform .12s;
}
.fab:active{transform:scale(.92);}
.fab.spin svg{animation:spin .85s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* the history: a small arrow in the bar, and a list that opens over the answers — so opening it moves nothing */
.hist-btn svg{transition:transform .18s;}
.hist-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.hist-btn.on svg{transform:rotate(180deg);}
.hist{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto;padding:6px;
  border:1px solid var(--line-2);border-radius:16px;background:var(--panel);box-shadow:0 14px 32px rgba(14,76,147,.20);
}
.hist[hidden]{display:none;}
.hist-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:11px;background:none;font:inherit;text-align:start;}
.hist-row:active{background:var(--tint);}
.hist-row .pill{flex:none;}
.hist-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--text);unicode-bidi:plaintext;}
.hist-t b{color:var(--blue);}
.hist-at{flex:none;font-size:12px;color:var(--muted);}
.hist-empty{padding:14px;text-align:center;color:var(--muted);font-weight:700;font-size:13.5px;}
.hist-clear{flex:none;margin-top:4px;padding:10px;border:0;border-top:1px solid var(--line);background:none;color:var(--bad);font:inherit;font-size:13px;font-weight:800;}

/* ---------- what the search is reading from ---------- */
.src{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px;}
.src .pill{font-size:12px;}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
.pill.wait .dot{animation:blink 1.1s infinite;}
@keyframes blink{50%{opacity:.3;}}

/* ---------- pills ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;line-height:1.5;
  padding:3px 11px;border-radius:999px;white-space:nowrap;
  color:var(--mute);background:var(--mute-bg);border:1px solid var(--mute-br);
}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-br);}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-br);}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-br);}
.pill.ban{background:var(--ban);color:#fff;border-color:var(--ban);}
.pill.blue{background:var(--blue);color:#fff;border-color:var(--blue);}
.pill.white{background:#fff;color:var(--text);border-color:var(--line-2);}
.pill.link{background:var(--tint);color:var(--blue);border-color:var(--line-2);}
button.pill{font-family:inherit;}

/* ---------- answers ---------- */
#mres{margin-top:14px;}
.note{
  margin-bottom:10px;padding:11px 15px;border-radius:var(--r);font-size:13.5px;font-weight:700;line-height:1.9;
  background:var(--tint);border:1px solid var(--line-2);color:var(--text-2);text-align:center;
}
.note.warn{background:var(--warn-bg);border-color:var(--warn-br);color:#7a4703;}
/* ---------- the answers ----------
   Everything a line found is laid out in full, one card under another: the
   employee's card with his photographs, and every permit the sheet holds for
   him, newest first. Nothing is behind a tap - the list is read by scrolling
   (asked for so, 5 October 2026: «تظهرلى الكروت تحت بعض»). */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}}
.sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-bottom:6px;animation:fadeUp .36s ease-out backwards;}
/* the line of the list an answer belongs to: its number, and what was typed */
.mterm{display:flex;align-items:center;gap:9px;margin:20px 2px 9px;}
.mterm::after{content:"";flex:1;height:1px;background:var(--line-2);opacity:.8;}
.mrow-n{
  flex:none;min-width:27px;height:27px;padding:0 6px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  background:var(--sun);border:1px solid var(--sun-deep);
  font-family:var(--mono);font-size:12px;font-weight:700;color:#3b2a04;
}
.term{font-family:'IBM Plex Mono','Tajawal','Segoe UI',Tahoma,sans-serif;font-size:14px;font-weight:700;color:var(--text-2);unicode-bidi:plaintext;word-break:break-word;}
.hit{animation:fadeUp .44s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards;}
.hit + .hit{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line-2);}
.mrow{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:12px 13px;border-radius:var(--r);
  animation:fadeUp .44s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards;
}
.mrow.miss{justify-content:center;background:rgba(251,227,227,.78);border:1px solid var(--bad-br);}
.mrow.more{justify-content:center;background:var(--panel-2);border:1px dashed var(--line-2);
  font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.7;margin-top:10px;}
.dr-sec{margin:14px 4px 8px;font-size:13px;font-weight:800;color:var(--navy);}
.dr-sec b{color:var(--blue);font-family:var(--mono);}
.rec{
  border-radius:var(--r-lg);overflow:hidden;margin-bottom:10px;
  border:1px solid rgba(255,255,255,.68);background:var(--card);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(21,101,192,.13);
}
.rec .head{padding:18px 16px 14px;text-align:center;border-bottom:1px solid var(--card-line);}
.code{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:9px;padding:3px 12px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line-2);font-size:13px;font-weight:700;color:var(--muted);
}
.code .num{color:var(--blue);font-weight:700;font-size:15px;}
.nm{font-size:19px;font-weight:800;line-height:1.42;margin:0;color:var(--text);}
.nm-en{margin:4px 0 0;font-family:var(--cond);font-size:16.5px;font-weight:700;letter-spacing:.03em;color:var(--text-2);text-transform:uppercase;direction:ltr;}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:11px;}
.permit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--card-line);}
.permit.ok{background:rgba(223,243,231,.85);}
.permit.warn{background:rgba(252,235,213,.9);}
.permit.bad{background:rgba(251,227,227,.9);}
.permit.ban{background:rgba(163,21,21,.92);color:#fff;}
.permit.mute{background:rgba(237,240,243,.9);}
.permit-k{font-size:13px;font-weight:800;}
.permit-v{font-size:17px;font-weight:800;unicode-bidi:plaintext;text-align:end;}
.permit-x{font-size:12px;font-weight:700;opacity:.82;margin-top:2px;text-align:end;}
.grp{padding:10px 14px 4px;}
.grp-t{display:block;font-size:12.5px;font-weight:800;color:var(--text-2);margin:0 2px 7px;}
.rows{margin:0;}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:7px;
  padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.82);border:1px solid var(--card-line);
}
.row dt{flex:none;font-size:13px;font-weight:800;color:var(--text-2);}
.row dd{margin:0;font-size:14.5px;font-weight:800;color:var(--text);text-align:left;word-break:break-word;min-width:0;unicode-bidi:plaintext;}
.row dd.num{font-weight:700;}
.row dd.bad{color:var(--bad);}
.shots{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;}
.shots img{display:block;width:100%;border-radius:12px;border:1px solid var(--card-line);background:var(--tint);}
.rec-pad{height:8px;}

/* ---------- credit ---------- */
.credit{padding-top:28px;text-align:center;direction:ltr;line-height:1.55;}
.credit-by{display:block;font-size:9px;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;color:var(--brand-green);opacity:.72;}
.credit-name{
  display:inline-block;margin-top:7px;padding:7px 15px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--tint);
  font-family:var(--cond);font-weight:700;font-size:13.5px;letter-spacing:.14em;text-indent:.14em;color:var(--blue);
}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="ncm">N<i>C</i><b>M</b></span>
      <span class="tagline">NUCLEAR CONCRETE MIXES</span>
      <span class="hr"></span>
      <span class="appname">PERMISSION</span>
      <span class="pagename" id="pagename">بحث متكرر</span>
    </div>
  </div>

  <div class="shell">
    <div class="multi-box">
      <textarea class="multi-ta" id="mt" rows="4" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="multi-bar">
        <div class="seg" id="seg">
          <button type="button" data-mmode="ind" class="on">أفراد</button>
          <button type="button" data-mmode="veh">مركبات</button>
        </div>
        <span class="multi-n" id="mt-n"></span>
        <button type="button" class="fab" id="refresh" aria-label="تحديث البيانات" title="تحديث">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 15a8 8 0 0 0 13.9 3.2M18.5 9A8 8 0 0 0 4.6 5.8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="rowbreak"></span>
        <button type="button" class="btn primary" id="go">بحث</button>
        <button type="button" class="btn" id="clear">مسح</button>
        <button type="button" class="fab hist-btn" id="hist-btn" aria-haspopup="true" aria-expanded="false" aria-label="سجل البحث" title="سجل البحث">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="hist" id="hist" hidden></div>
    </div>

    <div class="src" id="src" aria-live="polite"></div>
    <div id="mres" role="region" aria-live="polite"></div>

    <p class="credit">
      <span class="credit-by">Designed by</span>
      <span class="credit-name">KHALED SABRY</span>
    </p>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
/* Bump ACCESS_VERSION to lock every device that is already unlocked. It has to
   be the same number in all four files: the shell at the app root, the
   employees system, the permits system, and this one. */
const ACCESS_VERSION = "3";   // must match the shell at the app root
const UNLOCK_KEY = "ncm_device_unlocked";
const AUTH_KEY   = "ncm_key";
const SUPABASE_URL = "https://ljcalgumlodehoulbwtp.supabase.co";
const BUCKET = "employee-photos";
const EXPIRY_WINDOW = 30;                 // days that count as "expiring soon" — the app's number
const SHEET_ID = "1ZceJtmQMpW7Ky3Ysgz0mDcmE6Uxr600OuO2KOMHJnWE";
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/" + SHEET_ID;
const GVIZ_BASE = SHEET_BASE + "/gviz/tq?tqx=out:csv&sheet=";
const INDIVIDUALS_TAB = "تصاريح أفراد ";   // the trailing space is part of the tab's real name
const VEHICLES_TAB    = "تصاريح مركبات";

const $ = id => document.getElementById(id);
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ============================================================
   LANGUAGE — read from the home screen's choice, never changed here.
   The page stays right-to-left in both, as the permits system does: the
   table's columns keep their order whichever language names them.
   ============================================================ */
const I18N = {
  ar:{
    page:"بحث متكرر", segPeople:"أفراد", segVehicles:"مركبات", search:"بحث", clear:"مسح", lines:n => "سطور: " + n,
    ariaNids:"الأرقام القومية، رقم في كل سطر", ariaPlates:"أرقام السيارات، رقم في كل سطر",
    refresh:"تحديث البيانات", histAria:"سجل البحث", histEmpty:"السجل فاضي", histClear:"مسح السجل", close:"إغلاق",
    srcEmp:"الموظفين", srcInd:"تصاريح الأفراد", srcVeh:"تصاريح المركبات", loading:"جاري تحميل البيانات", stillLoading:"البيانات لسه بتحمّل، استنى ثانية وجرّب تاني.",
    sumAsked:"مطلوب", sumFound:"موجود", sumMiss:"مش موجود", sumDup:"متكرر في القايمة",
    searchLacks:x => x + " مش متحمّل دلوقتي — النتايج دي من غيره، و«مش موجود» مش أكيدة", and:" و",
    missRow:"مش موجود في الشيت", moreNames:(term, n) => "«" + term + "» — " + n + " كمان",

/* ============================================================
   TEXT AND DATES — the rules both other systems keep, word for word.
   ============================================================ */
function toLatinDigits(s){
  return String(s)
    .replace(/[٠-٩]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 48))
    .replace(/[۰-۹]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x06F0 + 48));
}
function normalize(s){
  if(s === null || s === undefined) return "";
  return toLatinDigits(String(s)).replace(/\s+/g, " ").trim();
}
function clean(s){ return (s === null || s === undefined) ? "" : String(s).trim(); }
function digitsOnly(s){ return normalize(s).replace(/[^\d]/g, ""); }
/* One shape per Arabic letter, for MATCHING only — the same folding the
   permits system does. What is shown is always what the sheet says. */
function foldArabic(s){
  return normalize(s)
    .replace(/[ً-ْٰ]/g, "")
    .replace(/ـ/g, "")
    .replace(/[أإآ]/g, "ا")
    .replace(/[ىئ]/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/\s+/g, "")
    .toLowerCase();
}
const pad2 = n => String(n).padStart(2, "0");
function today0(){ const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function mkDate(y, m, d){
  if(y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d); dt.setHours(0, 0, 0, 0);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
function fmt(dt){ return pad2(dt.getDate()) + "/" + pad2(dt.getMonth() + 1) + "/" + dt.getFullYear(); }
// The employees table: dd/mm/yyyy text (or ISO). Never the browser's own parser.
function parseStrict(v){
  const s = clean(v); if(!s) return null;
  let h;
  if((h = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return mkDate(+h[3], +h[2], +h[1]);
  if((h = s.match(/^(\d{4})[\-\/.](\d{1,2})[\-\/.](\d{1,2})/)))  return mkDate(+h[1], +h[2], +h[3]);
  return null;
}
// The permits sheet: a leading date, day first unless that is impossible,
// with whatever was typed after it kept as a note ("18-11-2025(ABNA SINA)").
const LEADING_DATE = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/;
function parseLoose(v){
  const s = normalize(v), m = s.match(LEADING_DATE);
  if(!m) return null;
  const a = +m[1], b = +m[2], y = +m[3];
  let day, month;
  if(b > 12 && a <= 12){ month = a; day = b; } else { day = a; month = b; }
  const date = mkDate(y, month, day);
  if(!date) return null;
  const rest = s.slice(m[0].length).replace(/^[\s\-\/(),.:؛;]+/, "").replace(/[)\]]+$/, "").trim();
  return { date, text: fmt(date), rest };
}
function daysTo(dt){
  const d = today0();
  return Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) -
                     Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
}

/* ============================================================
   EMPLOYEES — the rules are the employees system's, word for word.
   ============================================================ */
const EMP_FIELDS = ["emp_code","full_name","full_name_en","national_id","job_title","department","category","phone","hire_date",
  "address","permit_date","permit_status","ban_reason","resignation_end_date","notes",
  "letter_number","letter_date","letter_company","letter_note"];
function empStatus(e){
  const raw = e.permit_status, dl = e.dl;
  if(raw === "ممنوع") return { k:"ban", label:"ممنوع", code:"BANNED" };
  // someone who left: the permit is either still running or over
  if(e.resigned){
    if(raw === "ساري" && dl !== null && dl >= 0) return { k:"ok", label:"ساري", code:"VERIFIED" };
    return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
  }
  if(raw === "ساري"){
    if(e.permit_date === "ساري حتى الاستقالة") return { k:"ok", label:"ساري", code:"VERIFIED" };
    if(dl === null) return { k:"mute", label:"بدون تاريخ", code:"NO DATE" };
    if(dl < 0) return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
    if(dl <= EXPIRY_WINDOW) return { k:"warn", label:"قرب الانتهاء", code:"EXPIRING" };
    return { k:"ok", label:"ساري", code:"VERIFIED" };
  }
  if(raw === "منتهي الصلاحية") return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
  if(raw === "بدون تصريح" || raw === "") return { k:"mute", label:"بدون تصريح", code:"NO PERMIT" };
  return { k:"mute", label:raw, code:"UNKNOWN" };
}
function byCode(a, b){
  const x = parseInt(digitsOnly(a.emp_code), 10), y = parseInt(digitsOnly(b.emp_code), 10);
  if(isNaN(x) && isNaN(y)) return 0;
  if(isNaN(x)) return 1;
  if(isNaN(y)) return -1;
  return x - y;
}
function buildEmployees(rows){
  const list = [], seen = new Set();
  rows.forEach(r => {
    if(!r) return;
    const e = {};
    EMP_FIELDS.forEach(k => { e[k] = clean(r[k]); });
    if(!e.emp_code || seen.has(e.emp_code)) return;
    seen.add(e.emp_code);
    e.resigned = !!e.resignation_end_date;                       // any value counts, even «غير محدد»
    e.foreign  = !(e.national_id.length === 14 && /^[0-9]+$/.test(e.national_id));
    e.pdate    = parseStrict(e.permit_date);
    e.dl       = e.pdate ? daysTo(e.pdate) : null;
    e.st       = empStatus(e);
    e.nid      = digitsOnly(e.national_id);
    list.push(e);
  });
  list.sort(byCode);
  const byCodeMap = new Map(), byNid = new Map();
  list.forEach(e => {
    byCodeMap.set(e.emp_code, e);
    if(!e.foreign){ if(!byNid.has(e.nid)) byNid.set(e.nid, []); byNid.get(e.nid).push(e); }
  });
  return { list, byCode: byCodeMap, byNid };
}

/* ============================================================
   PERMITS — columns are read by position, exactly as the permits system does.
   ============================================================ */
const IND_COL = { NAME:2, JOB:3, ID:4, ADDR:5, NOTE:6, SENDER:7, PERMIT:8, DAY:9, MAIL:10, LETTER:11, COMPANY:12, LDATE:13, ANOTE:14 };
const VEH_COL = { PLATE:2, TYPE:3, OWNER:4, PERMIT:5, DAY:6, MAIL:7 };
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
/* Where a permit stands, from what is written in its cell. `auto` marks the
   two wordings that are the system's own and not the sheet's, so the page can
   say them in whichever language it is showing. */
function classify(rawValue){
  const s = normalize(rawValue);
  if(s === "") return { cat:"pending", cls:"warn", main:"في انتظار الرد", auto:"pending", note:"", date:null, dl:null };
  if(/^[؟?]+$/.test(s.replace(/\s+/g, ""))) return { cat:"undet", cls:"mute", main:"غير محدد موقفه حتى الآن", auto:"undet", note:"", date:null, dl:null };
  if(s.includes("منع")) return { cat:"ban", cls:"ban", main:s, note:"", date:null, dl:null };
  if(RENEW_WORDS.some(w => s.includes(w))) return { cat:"renew", cls:"bad", main:s, note:"", date:null, dl:null };
  if(s.includes("مؤقت")) return { cat:"temp", cls:"mute", main:s, note:"", date:null, dl:null };
  const p = parseLoose(s);
  if(p){
    const dl = daysTo(p.date);
    return { cat: dl < 0 ? "expired" : dl <= EXPIRY_WINDOW ? "soon" : "ok",
             cls: dl < 0 ? "bad" : dl <= EXPIRY_WINDOW ? "warn" : "ok",
             main: p.text, note: p.rest, date: p.date, dl };
  }
  if(s.includes("انتظار")) return { cat:"pending", cls:"warn", main:s, note:"", date:null, dl:null };
  return { cat:"undet", cls:"mute", main:s, note:"", date:null, dl:null };
}
// dated first in order, undated after them; the LAST one is the one that counts
function sortByDay(records){
  return records.slice().sort((a, b) => {
    if(a.dayDate && b.dayDate) return a.dayDate - b.dayDate;
    if(a.dayDate) return -1;
    if(b.dayDate) return 1;
    return 0;
  });
}
function buildIndividuals(rows){
  const C = IND_COL, groups = new Map();
  rows.forEach(c => {
    if(!c || c.length < 5) return;
    const idVal = normalize(c[C.ID]), nameVal = normalize(c[C.NAME]);
    if(!idVal && !nameVal) return;
    const key = idVal ? "ID:" + digitsOnly(idVal) : "NAME:" + nameVal;
    if(!groups.has(key)) groups.set(key, { key, name: nameVal, nationalId: idVal, nid: digitsOnly(idVal), records: [], names: new Map() });
    const g = groups.get(key);
    const f = foldArabic(nameVal);
    if(f && !g.names.has(f)) g.names.set(f, nameVal);
    const day = parseLoose(c[C.DAY]);
    g.records.push({
      name: nameVal, job: normalize(c[C.JOB]), address: normalize(c[C.ADDR]), note: normalize(c[C.NOTE]),
      sender: normalize(c[C.SENDER]), mail: normalize(c[C.MAIL]), letter: normalize(c[C.LETTER]),
      company: normalize(c[C.COMPANY]), ldate: normalize(c[C.LDATE]), anote: normalize(c[C.ANOTE]),
      day: normalize(c[C.DAY]), dayDate: day ? day.date : null, dayText: day ? day.text : "",
      dayNote: day ? day.rest : normalize(c[C.DAY]), p: classify(c[C.PERMIT])
    });
  });
  const list = [], byNid = new Map();
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    if(g.nid) byNid.set(g.nid, g);
    list.push(g);
  });
  return { list, groups, byNid };
}
function buildVehicles(rows){
  const C = VEH_COL, groups = new Map();
  rows.forEach(c => {
    if(!c || c.length < 3) return;
    const plate = normalize(c[C.PLATE]);
    if(!plate) return;
    const key = foldArabic(plate);
    if(!groups.has(key)) groups.set(key, { key, plate, records: [] });
    const g = groups.get(key);
    const day = parseLoose(c[C.DAY]);
    g.records.push({
      plate, type: normalize(c[C.TYPE]), owner: normalize(c[C.OWNER]), mail: normalize(c[C.MAIL]),
      day: normalize(c[C.DAY]), dayDate: day ? day.date : null, dayText: day ? day.text : "",
      dayNote: day ? day.rest : normalize(c[C.DAY]), p: classify(c[C.PERMIT])
    });
  });
  const list = [];
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    list.push(g);
  });
  return { list, groups };
}
/* The model the search reads: each source there or not, and the two that hold
   people tied together by national id — so a man who is in both is one answer. */
const M = { emp: null, ind: null, veh: null };
function linkModel(){
  if(M.emp) M.emp.list.forEach(e => { e.per = (M.ind && !e.foreign) ? (M.ind.byNid.get(e.nid) || null) : null; });
  if(M.ind) M.ind.list.forEach(g => { g.emp = (M.emp && g.nid && M.emp.byNid.get(g.nid)) || null; });
}

/* ============================================================
   LOADING
   The employees come from the table with the key the home screen unsealed;
   the permits from the sheet's CSV export, tab by tab, the gid looked up fresh
   by the tab's name - both exactly as the two systems read them. The three are
   asked for at once and each arrives on its own, so a slow sheet does not hold
   the employees back; the row of marks under the box says which are in.
   ============================================================ */
let sb = null;
const SRC = { emp:"wait", ind:"wait", veh:"wait" };       // wait | ok | bad
function paintSrc(){
  const one = (k, name) => '<span class="pill ' + (SRC[k] === "ok" ? "ok" : SRC[k] === "bad" ? "bad" : "wait") + '"><span class="dot"></span>' + esc(t(name)) + "</span>";
  $("src").innerHTML = one("emp", "srcEmp") + one("ind", "srcInd") + one("veh", "srcVeh");
}
/* The table answers a plain select with its first 1000 rows and says nothing
   about the rest, so it is read a page at a time, in id order (see the
   employees system for the long version of why). */
async function fetchAllEmployees(){
  const rows = [], PAGE = 1000;
  for(let from = 0; ; from += PAGE){
    const { data, error } = await sb.from("employees").select("*").order("id", { ascending: true }).range(from, from + PAGE - 1);
    if(error) throw error;
    const page = data || [];
    rows.push(...page);
    if(page.length < PAGE) return rows;
  }
}
let tabGidsPromise = null;
function loadTabGids(){
  if(!tabGidsPromise){
    tabGidsPromise = fetch(SHEET_BASE + "/htmlview?_=" + Date.now(), { cache:"no-store" })
      .then(r => r.ok ? r.text() : Promise.reject(new Error("htmlview " + r.status)))
      .then(html => {
        const map = new Map();
        const re = /items\.push\(\{name: "((?:[^"\\]|\\.)*)"[\s\S]*?gid: "(\d+)"/g;
        let m;
        while((m = re.exec(html))){
          try{ map.set(JSON.parse('"' + m[1].replace(/\\x([0-9a-fA-F]{2})/g, "\\u00$1") + '"'), m[2]); }catch(e){}
        }
        return map;
      });
    tabGidsPromise.catch(() => { tabGidsPromise = null; });
  }
  return tabGidsPromise;
}
async function tabCsvUrl(name){
  try{
    const gids = await loadTabGids();
    if(gids.has(name)) return SHEET_BASE + "/export?format=csv&gid=" + gids.get(name);
  }catch(e){ console.warn("tab gids unavailable, falling back to gviz", e); }
  return GVIZ_BASE + encodeURIComponent(name);
}
function loadCSV(url){
  const busted = url + (url.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();
  return new Promise((resolve, reject) => {
    Papa.parse(busted, { download:true, header:false, skipEmptyLines:false,
      complete: res => resolve(res.data), error: err => reject(err) });
  });
}
let loadRun = 0;
function loadAll(){
  const run = ++loadRun;
  SRC.emp = SRC.ind = SRC.veh = "wait";
  tabGidsPromise = null;                    // an upload since the last load gave the tabs new gids
  paintSrc();
  const done = (k, model) => {
    if(run !== loadRun) return;
    M[k] = model; SRC[k] = model ? "ok" : "bad";
    linkModel(); paintSrc();
    if(st.res) { runMulti(); paintMulti(); }           // an answer on screen is asked again with what has just come in
  };
  const emp = fetchAllEmployees().then(rows => done("emp", buildEmployees(rows)), err => { console.error("[NCM] employees", err); done("emp", null); });
  const ind = tabCsvUrl(INDIVIDUALS_TAB).then(loadCSV).then(rows => done("ind", buildIndividuals(rows.slice(1))), err => { console.error("[NCM] individuals", err); done("ind", null); });
  const veh = tabCsvUrl(VEHICLES_TAB).then(loadCSV).then(rows => done("veh", buildVehicles(rows.slice(1))), err => { console.error("[NCM] vehicles", err); done("veh", null); });
  return Promise.all([emp, ind, veh]);
}

/* ============================================================
   THE SEARCH
   ============================================================ */
const st = { mode: "ind", text: "", res: null };
const MULTI_CAP = 5000;        // per line: more than either sheet holds, so everything a line finds is shown — a guard, not a limit anyone meets
const NAME_SHOW = 50;          // of a name that finds more people than this, this many are listed and the rest are counted

/* The written list, one entry each. A new line splits, and so do a comma, a
   semicolon and a tab, because that is how a list arrives when it is pasted
   out of a message or a sheet. An entry written twice is asked once and counted. */
function parseTerms(text){
  const terms = [], seenT = new Set(); let dup = 0;
  toLatinDigits(text || "").split(/[\n\r,;،\t]+/).forEach(piece => {
    let parts = [piece.trim()];
    /* Digits with gaps on one line are either several ids pasted side by side
       or one id typed with a space in it. Fourteen digits in all is one
       national id however it was spaced ("2990102 2020231" is a man, not two
       half-numbers); otherwise pieces long enough to stand alone are separate
       entries, and anything else is one number with stray spaces. */
    if(/^[\d\s]+$/.test(parts[0]) && /\s/.test(parts[0])){
      const toks = parts[0].split(/\s+/), joined = toks.join("");
      parts = joined.length === 14 ? [joined] : toks.every(x => x.length >= 5) ? toks : [joined];
    }
    parts.forEach(p => {
      p = normalize(p);
      if(!p) return;
      const k = foldArabic(p);
      if(seenT.has(k)){ dup++; return; }
      seenT.add(k); terms.push(p);
    });
  });
  return { terms, dup };
}
const capped = all => ({ list: all.slice(0, MULTI_CAP), more: Math.max(0, all.length - MULTI_CAP) });
// what was typed, a word at a time, folded the way names and plates are folded for matching
const wordsOf = term => term.split(/\s+/).map(w => foldArabic(w)).filter(Boolean);
function findPeople(term){
  const d = digitsOnly(term), f = foldArabic(term), numeric = /^[\d\s-]+$/.test(term);
  const hits = [], seenG = new Set(), seenE = new Set();
  // a man who is in both sources is one row, not two
  const addG = g => {
    if(seenG.has(g.key)) return;
    seenG.add(g.key);
    (g.emp || []).forEach(e => seenE.add(e.emp_code));
    hits.push({ g, emps: g.emp || [] });
  };
  const addE = e => {
    if(seenE.has(e.emp_code)) return;
    if(e.per) return addG(e.per);
    seenE.add(e.emp_code);
    hits.push({ g: null, emps: [e] });
  };
  if(numeric){
    if(d.length === 14){
      const g = M.ind && M.ind.byNid.get(d);
      if(g) addG(g);
      ((M.emp && M.emp.byNid.get(d)) || []).forEach(addE);
    }else{
      // a short number is an employee's code, whole; five digits and up is also looked for inside every national id
      const byC = M.emp && M.emp.byCode.get(d);
      if(byC) addE(byC);
      if(d.length >= 5){
        if(M.ind) M.ind.list.forEach(g => { if(g.nid && g.nid.includes(d)) addG(g); });
        if(M.emp) M.emp.list.forEach(e => { if(e.nid && e.nid.includes(d)) addE(e); });
      }
    }
  }else if(f){
    /* A NAME TYPED IN PART finds everyone it is part of. Every word typed has
       to be in the name, in any order and with anything between them — so
       «ابراهيم سالم» finds «ابراهيم احمد محمد سالم». All of them are shown,
       the closest first: the name that is exactly what was typed, then the
       names that hold it as it was typed, then the names that hold its words.
       A name as common as «محمد» finds hundreds: of those only the first
       NAME_SHOW are listed and the line ends by saying how many more there are. */
    const words = wordsOf(term), hasAll = s => words.every(w => s.includes(w));
    const en = e => e.full_name_en.toLowerCase().replace(/\s+/g, "");
    const rankG = g => {
      let best = 9;
      for(const n of g.names.keys()){ const r = n === f ? 0 : n.includes(f) ? 1 : hasAll(n) ? 2 : 9; if(r < best) best = r; }
      return best;
    };
    const rankE = e => {
      const a = foldArabic(e.full_name), b = en(e);
      return a === f || b === f || foldArabic(e.national_id) === f ? 0 : a.includes(f) || b.includes(f) ? 1 : hasAll(a) || hasAll(b) ? 2 : 9;
    };
    const found = [];
    if(M.ind) M.ind.list.forEach(g => { const r = rankG(g); if(r < 9) found.push({ r, name: g.name, add: () => addG(g) }); });
    if(M.emp) M.emp.list.forEach(e => { const r = rankE(e); if(r < 9) found.push({ r, name: e.full_name, add: () => addE(e) }); });
    found.sort((a, b) => a.r - b.r || foldArabic(a.name).localeCompare(foldArabic(b.name), "ar"));
    found.forEach(x => x.add());
    if(hits.length > NAME_SHOW) return { list: hits.slice(0, NAME_SHOW), more: hits.length - NAME_SHOW, names: true };
  }
  return capped(hits);
}
function findVehicles(term){
  if(!M.veh) return capped([]);
  const f = foldArabic(term), d = digitsOnly(term), numeric = /^[\d\s-]+$/.test(term);
  if(numeric){
    /* THE NUMBER ALONE, without the letters, finds every plate that has that
       number in it, whatever its letters. All of them are shown: the plate
       numbered exactly so first, then the plates whose number begins with
       it, then the rest. */
    if(!d) return capped([]);
    const rank = g => { const x = g.key.replace(/\D/g, ""); return x === d ? 0 : x.startsWith(d) ? 1 : 2; };
    return capped(M.veh.list.filter(g => g.key.includes(d)).map(g => ({ g, r: rank(g) }))
      .sort((a, b) => a.r - b.r || a.g.key.localeCompare(b.g.key, "ar")).map(x => ({ g: x.g })));
  }
  const exact = M.veh.groups.get(f);
  if(exact) return capped([{ g: exact }]);
  // letters, or letters and numbers, typed in part: every piece typed has to be in the plate
  const words = wordsOf(term);
  return capped(M.veh.list.filter(g => g.key.includes(f) || words.every(w => g.key.includes(w))).map(g => ({ g })));
}
function runMulti(){
  const parsed = parseTerms(st.text), rows = [];
  let found = 0;
  parsed.terms.forEach((term, i) => {
    const hits = st.mode === "veh" ? findVehicles(term) : findPeople(term);
    if(!hits.list.length){ rows.push({ n: i + 1, term, miss: true }); return; }
    found++;
    hits.list.forEach(h => rows.push(Object.assign({ n: i + 1, term }, h)));
    if(hits.more) rows.push({ n: i + 1, term, more: hits.more, names: !!hits.names });
  });
  st.res = { rows, mode: st.mode, terms: parsed.terms.length, dup: parsed.dup, found, miss: parsed.terms.length - found };
}

function paintMulti(){

    Object.keys(CAT_PILL).filter(k => cats[k]).map(k => '<span class="pill ' + CAT_PILL[k] + '">' + t(CAT_NAME[k]) + " " + num(cats[k]) + "</span>").join("") +
    "</div>";

  const lacking = res.mode === "veh" ? (M.veh ? [] : ["srcVeh"]) : [M.ind ? "" : "srcInd", M.emp ? "" : "srcEmp"].filter(Boolean);
  let line = 0, turn = 0;

    }).join("");

/* ============================================================
   SEARCH HISTORY
   Every search that is run is remembered on this phone — the list as it was
   typed, whether it was people or vehicles, how many lines, when — newest
   first, the same search never twice. The small arrow in the bar opens it; a
   line in it puts that list back in the box and runs it again. Locking the
   app from the home screen wipes it along with the key.
   ============================================================ */
const HIST_KEY = "ncm_multi_history", HIST_MAX = 40;
let HIST = [];
function histLoad(){
  HIST = [];
  try{
    const list = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
    // what comes off the disk is taken for nothing more than what it should be
    if(Array.isArray(list)) HIST = list.filter(x => x && typeof x.t === "string" && x.t).slice(0, HIST_MAX)
      .map(x => ({ m: x.m === "veh" ? "veh" : "ind", t: x.t.slice(0, 6000), n: +x.n || 0, f: +x.f || 0, at: +x.at || 0 }));
  }catch(e){ HIST = []; }
}
function histSave(){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(HIST)); }catch(e){} }
function histAdd(){
  const res = st.res;
  if(!res || !res.terms) return;
  const text = parseTerms(st.text).terms.join("\n").slice(0, 6000);
  HIST = HIST.filter(x => !(x.m === res.mode && x.t === text));
  HIST.unshift({ m: res.mode, t: text, n: res.terms, f: res.found, at: Date.now() });
  if(HIST.length > HIST_MAX) HIST.length = HIST_MAX;
  histSave();
}
function stamp(at){
  if(!at) return "";
  const d = new Date(at);
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function histHTML(){
  if(!HIST.length) return '<div class="hist-empty">' + esc(t("histEmpty")) + "</div>";
  return HIST.map((x, i) => {
    const terms = x.t.split("\n");
    return '<button type="button" class="hist-row" data-hist="' + i + '">' + pill(x.m === "veh" ? "link" : "white", t(x.m === "veh" ? "segVehicles" : "segPeople")) +
      '<span class="hist-t">' + esc(terms.slice(0, 2).join(" · ")) + (terms.length > 2 ? " <b>+" + (terms.length - 2) + "</b>" : "") + "</span>" +
      '<span class="hist-at num">' + esc(stamp(x.at)) + "</span></button>";
  }).join("") + '<button type="button" class="hist-clear" id="hist-clear">' + esc(t("histClear")) + "</button>";
}
function histToggle(open){
  const box = $("hist");

  const x = HIST[i];

}

/* ============================================================
   BOOT
   The shell at the app root owns the PIN. Arriving here without the unsealed
   key means this device was never let in, or the unlock was revoked, so the
   page hands the visitor back to the door.
   ============================================================ */
function storedKey(){
  // The cookie survives the storage sweeps that wipe localStorage, and the
  // other way round; either one alone is enough to stay unlocked.
  let flag = null;
  try{ flag = localStorage.getItem(UNLOCK_KEY); }catch(e){}
  if(!flag){
    const hit = document.cookie.split("; ").find(c => c.startsWith(UNLOCK_KEY + "="));
    flag = hit ? decodeURIComponent(hit.slice(UNLOCK_KEY.length + 1)) : null;
  }
  if(flag !== ACCESS_VERSION) return null;
  try{ return localStorage.getItem(AUTH_KEY); }catch(e){ return null; }
}
const key = storedKey();
if(!key){
  location.replace("../");
}else{
  sb = supabase.createClient(SUPABASE_URL, key);
  histLoad();
  const last = kept();
  if(last){ st.mode = last.m; st.text = last.t; $("mt").value = last.t; }
  applyLang();
  paintMulti();
  loadAll().then(() => {
    // the list left on screen last time is asked again, now that there is something to ask
    if(last && parseTerms(last.t).terms.length && !st.res){ runMulti(); paintMulti(); }
  });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("../service-worker.js").catch(() => {}));
}
</script>
