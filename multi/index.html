<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCM PERMISSION — بحث متكرر</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#edf2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="../supabase.min.js"></script>
<script src="../lib/papaparse.min.js"></script>
<style>
/* ============================================================
   THE LIST SEARCH — the third system.
   A whole list in one go: a national id, a code or a name on each line (or a
   plate on each line), answered a line at a time out of BOTH sources at once -
   the employees table and the permits sheet. What it DOES is the search of the
   desk system (Khaled's NCM SYSTEM): the same way of reading the list and the
   same rules for who a line finds. What it LOOKS like is this app and nothing
   else - the desk's wide table of fifteen columns is no use on a phone, so
   each answer is the cards the other two systems already draw for it.

   It is a file of its own on purpose, like the other two systems: it borrows
   their rules by copying them, and shares no name with either.
   The colours and the type are the employees system's.
   ============================================================ */
:root{
  --bg:#edf2f8;
  --panel:#ffffff;
  --panel-2:#f3f7fb;
  --blue:#1565c0;
  --blue-soft:#1e75d6;
  --tint:#e6eef8;
  --card:rgba(182,213,247,.42);
  --card-line:#c9d9ea;
  --brand-green:#4ba548;
  --brand-blue:#1565c0;
  --navy:#1f4e79;
  --brand-grey:#4a5a6b;
  --ok:#12874f;    --ok-bg:#dff3e7;    --ok-br:#8fd3ae;
  --warn:#b96e08;  --warn-bg:#fcebd5;  --warn-br:#efc383;
  --bad:#c22f2f;   --bad-bg:#fbe3e3;   --bad-br:#efa9a9;
  --ban:#a31515;
  --mute:#4a5a6b;  --mute-bg:#edf0f3;  --mute-br:#cbd3db;
  /* this system's own colour on the home screen: a mid yellow */
  --sun:#f2bf3f;   --sun-deep:#d99c14;
  --text:#0b1114;
  --text-2:#2a3238;
  --muted:#3b4a5c;
  --line:#e2e9f2;
  --line-2:#c0d3ec;
  --r-sm:10px;
  --r:14px;
  --r-lg:18px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cond:'Barlow Condensed',sans-serif;
  --sans:'Tajawal',system-ui,sans-serif;
  /* the employees system's tokens, by their own names, for its card below */
  --gold:#1565c0;
  --gold-soft:#1e75d6;
  --brand-navy:#1f4e79;
  --brand-ink:#0b1114;
  --success:#12874f;  --success-bg:#dff3e7;  --success-br:#8fd3ae;
  --warning:#b96e08;  --warning-bg:#fcebd5;  --warning-br:#efc383;
  --danger:#c22f2f;   --danger-bg:#fbe3e3;   --danger-br:#efa9a9;
  --neutral:#4a5a6b;  --neutral-bg:#edf0f3;  --neutral-br:#cbd3db;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 460px at 50% -10%, rgba(21,101,192,.09) 0%, transparent 62%),
    radial-gradient(680px 420px at 12% 42%, rgba(242,191,63,.10) 0%, transparent 64%),
    radial-gradient(760px 520px at 92% 88%, rgba(21,101,192,.07) 0%, transparent 66%);
  background-repeat:no-repeat;background-attachment:fixed;
  min-height:100dvh;
}
body{
  background:transparent;color:var(--text);font-family:var(--sans);font-weight:500;
  min-height:100dvh;padding-bottom:calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  /* Tajawal swaps digits to Arabic-Indic forms while the page language is
     Arabic; turning off the localised forms keeps every number Western. */
  font-feature-settings:"locl" 0;
  font-variant-numeric:lining-nums;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}

/* ---------- shell ---------- */
.topbar{padding:calc(24px + env(safe-area-inset-top)) 20px 2px;text-align:center;}
.shell{max-width:760px;margin:0 auto;padding:0 14px;}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1;}
.ncm{
  font-family:var(--sans),'Arial Black',system-ui;font-weight:900;font-size:32px;line-height:1;
  color:var(--brand-blue);direction:ltr;unicode-bidi:isolate;
}
.ncm i{font-style:normal;color:var(--brand-green);}
.ncm b{font-weight:inherit;color:var(--brand-grey);}
.tagline{font-size:10.5px;letter-spacing:.17em;text-indent:.17em;color:var(--navy);margin-top:9px;direction:ltr;unicode-bidi:isolate;}
.brand .hr{display:block;width:46px;height:1px;margin:10px auto 8px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);}
.appname{font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.13em;text-indent:.13em;line-height:1;color:var(--blue);}
.pagename{
  display:inline-block;margin-top:11px;padding:5px 16px;border-radius:999px;
  background:var(--sun);border:1px solid var(--sun-deep);color:#3b2a04;
  font-size:13.5px;font-weight:800;
}

/* ---------- the list box ---------- */
.multi-box{position:relative;display:flex;flex-direction:column;gap:10px;margin-top:14px;animation:fadeUp .4s ease-out backwards;}
/* --mono ends in the generic "monospace", which answers for Arabic before
   Tajawal ever gets asked — so the stack is spelled out here instead. */
.multi-ta{
  display:block;width:100%;min-height:132px;max-height:38vh;resize:none;padding:11px 15px;text-align:center;
  border-radius:var(--r-lg);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);
  font-family:'IBM Plex Mono','Tajawal','Segoe UI',Tahoma,sans-serif;
  font-size:16px;font-weight:600;line-height:1.9;outline:none;
  /* each line takes its own direction: a number reads left to right, a name right to left */
  unicode-bidi:plaintext;
  transition:border-color .18s,box-shadow .18s;
}
.multi-ta:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.10);}
.multi-ta::placeholder{font-family:var(--sans);font-weight:500;color:var(--muted);}
/* Two rows on a phone: which sheet and how many lines, then the two buttons
   and the history arrow. Every piece has a width of its own rather than its
   word's, so «بحث» and "Search" do not shuffle the row. */
.multi-bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--panel-2);}
.seg button{border:none;background:none;width:86px;padding:8px 0;font-size:13.5px;font-weight:800;color:var(--muted);transition:background .14s,color .14s;}
.seg button.on{background:var(--blue);color:#fff;}
.multi-n{width:92px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);}
.rowbreak{flex-basis:100%;height:0;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--tint);color:var(--blue);font-size:14.5px;font-weight:800;
  transition:background .16s,transform .12s,filter .16s;
}
.btn:active{transform:scale(.96);}
.btn.primary{flex:1;min-width:150px;padding-block:13px;font-size:15.5px;background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(21,101,192,.24);}
.btn[disabled]{opacity:.55;cursor:default;}
.fab{
  flex:none;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);background:var(--tint);color:var(--blue);
  transition:background .16s,transform .12s;
}
.fab:active{transform:scale(.92);}
.fab.spin svg{animation:spin .85s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* the history: a small arrow in the bar, and a list that opens over the answers — so opening it moves nothing */
.hist-btn svg{transition:transform .18s;}
.hist-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.hist-btn.on svg{transform:rotate(180deg);}
.hist{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto;padding:6px;
  border:1px solid var(--line-2);border-radius:16px;background:var(--panel);box-shadow:0 14px 32px rgba(14,76,147,.20);
}
.hist[hidden]{display:none;}
.hist-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:11px;background:none;font:inherit;text-align:start;}
.hist-row:active{background:var(--tint);}
.hist-row .pill{flex:none;}
.hist-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--text);unicode-bidi:plaintext;}
.hist-t b{color:var(--blue);}
.hist-at{flex:none;font-size:12px;color:var(--muted);}
.hist-empty{padding:14px;text-align:center;color:var(--muted);font-weight:700;font-size:13.5px;}
.hist-clear{flex:none;margin-top:4px;padding:10px;border:0;border-top:1px solid var(--line);background:none;color:var(--bad);font:inherit;font-size:13px;font-weight:800;}

/* ---------- what the search is reading from ---------- */
.src{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px;}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
.pill.wait .dot{animation:blink 1.1s infinite;}
@keyframes blink{50%{opacity:.3;}}

/* ---------- pills the page itself draws (the count on top, the sources) ----------
   The base .pill is the employee card's, below; these are the kinds it does not have. */
.pill.ban{background:var(--ban);color:#fff;border-color:var(--ban);}
.pill.link{background:var(--tint);color:var(--blue);border-color:var(--line-2);}
.sum .pill,.src .pill,.hist .pill,.mrow .pill{font-size:13px;line-height:1.5;padding:3px 11px;gap:6px;white-space:nowrap;}
.src .pill{font-size:12px;}

/* ---------- answers ---------- */
#mres{margin-top:14px;}
.note{
  margin-bottom:10px;padding:11px 15px;border-radius:var(--r);font-size:13.5px;font-weight:700;line-height:1.9;
  background:var(--tint);border:1px solid var(--line-2);color:var(--text-2);text-align:center;
}
.note.warn{background:var(--warn-bg);border-color:var(--warn-br);color:#7a4703;}
/* Everything a line found is laid out in full, one card under another, and
   each card is the one its own system draws: the employee's card exactly as
   the employees system shows it, and the permits card exactly as the permits
   system shows it - one permit at a time, with the 1-2-3 buttons for a man or
   a car that has several (asked for so, 5 October 2026). */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}}
.sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-bottom:6px;animation:fadeUp .36s ease-out backwards;}
/* the line of the list an answer belongs to: its number, and what was typed */
.mterm{display:flex;align-items:center;gap:9px;margin:20px 2px 4px;}
.mterm::after{content:"";flex:1;height:1px;background:var(--line-2);opacity:.8;}
.mrow-n{
  flex:none;min-width:27px;height:27px;padding:0 6px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  background:var(--sun);border:1px solid var(--sun-deep);
  font-family:var(--mono);font-size:12px;font-weight:700;color:#3b2a04;
}
.term{font-family:'IBM Plex Mono','Tajawal','Segoe UI',Tahoma,sans-serif;font-size:14px;font-weight:700;color:var(--text-2);unicode-bidi:plaintext;word-break:break-word;}
.hit + .hit{margin-top:18px;padding-top:6px;border-top:1px dashed var(--line-2);}
/* In English the employees system turns its whole page left-to-right and its
   card answers with `html[dir="ltr"] .row dd.ltr` (below). This page stays
   right-to-left in both languages, so the same answer is given by language. */
html[lang="en"] .row dd.ltr{text-align:right;}
.mrow{
  display:flex;align-items:center;gap:11px;width:100%;margin-top:10px;
  padding:12px 13px;border-radius:var(--r);
  animation:fadeUp .44s cubic-bezier(.2,.8,.2,1) backwards;
}
.mrow.miss{justify-content:center;background:rgba(251,227,227,.78);border:1px solid var(--bad-br);}
.mrow.more{justify-content:center;background:var(--panel-2);border:1px dashed var(--line-2);
  font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.7;}

/* ============================================================
   THE EMPLOYEE CARD — copied from employees/index.html, rule for rule.
   Change it there first, then bring the change here.
   ============================================================ */
/* download control, under both photos */
.dlbtn{
  width:100%;padding:12px;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--gold);background:var(--gold);
  color:#fff;font-weight:800;font-size:14.5px;
  transition:background .16s,color .16s,border-color .16s;
}
.dlbtn:hover{background:var(--gold-soft);}
.dlbtn[disabled]{cursor:default;}
.dlbtn.done{color:var(--success);border-color:var(--success-br);background:var(--success-bg);}
.dlbtn.fail{color:var(--danger);border-color:var(--danger-br);background:var(--danger-bg);}

/* ============================================================
   EMPLOYEE CARD — one calm card
   ============================================================ */
.rec{
  /* pinned: the interface may flip, but a record the guard has learned to read
     must not rearrange itself around him */
  direction:rtl;
  margin-top:14px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid rgba(255,255,255,.68);background:var(--card);
  backdrop-filter:blur(13px) saturate(1.25);
  -webkit-backdrop-filter:blur(13px) saturate(1.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(21,101,192,.13);
  animation:rise .26s ease-out both;
}
@keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
.rec[data-s="ok"]  {--tone:var(--success);}
.rec[data-s="warn"]{--tone:var(--warning);}
.rec[data-s="bad"] {--tone:var(--danger);}
.rec[data-s="mute"]{--tone:var(--neutral);}

/* identity */
.head{padding:22px 18px 18px;text-align:center;border-bottom:1px solid var(--card-line);}
.code{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;
  font-size:12px;font-weight:800;color:var(--gold);
  background:var(--tint);border:1px solid var(--line-2);
  border-radius:999px;padding:3px 12px;
}
.code em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700;}
.code .num{font-size:13.5px;}
.nm{font-size:20px;font-weight:800;line-height:1.42;margin:0;color:var(--text);letter-spacing:-.01em;}
.nm-en{
  font-family:var(--cond);font-weight:800;letter-spacing:.04em;font-size:19px;
  color:var(--text-2);text-transform:uppercase;direction:ltr;margin:4px 0 0;line-height:1.3;
}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.pill{
  display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;
  padding:5px 13px;border-radius:999px;color:var(--neutral);
  background:var(--neutral-bg);border:1px solid var(--neutral-br);
}
.pill.ok  {background:var(--success-bg);color:var(--success);border-color:var(--success-br);}
.pill.warn{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-br);}
.pill.bad {background:var(--danger-bg);color:var(--danger);border-color:var(--danger-br);}
.pill.mute{background:var(--neutral-bg);color:var(--neutral);border-color:var(--neutral-br);}
.pill.blue {background:var(--gold);color:#fff;border-color:var(--gold);}
.pill.white{background:#fff;color:var(--text);border-color:var(--line-2);}
.ic{flex:none;width:13px;height:13px;}

/* permit strip */
.permit{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 18px;border-bottom:1px solid var(--card-line);
  background:color-mix(in srgb, var(--tone) 16%, #ffffff);
}
.permit-k{font-size:13px;font-weight:800;color:var(--text);}
.permit-s{font-size:15.5px;font-weight:800;color:var(--tone);margin-top:3px;}
.permit-c{font-size:14px;color:var(--text);margin-top:5px;font-weight:800;}
.permit-d{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--tone);line-height:1;letter-spacing:-.02em;}
.permit-d.na{font-family:var(--sans);font-size:17px;font-weight:800;color:var(--neutral);}
.track{position:relative;height:4px;border-radius:999px;margin-top:9px;overflow:hidden;background:var(--line);}
.track span{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:var(--tone);opacity:.85;}

/* info list — grouped rows, no extra cards */
.grp{padding:0 14px;}
.grp-t{
  display:block;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--text);
  padding:15px 4px 8px;
}
.rows{margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
/* every field sits in its own panel */
.row{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:11px 14px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.82);border:1px solid #c7d3e0;
}
.row dt{flex:none;font-size:14px;font-weight:800;color:var(--text);margin:0;}
.row dd{margin:0;font-size:15.5px;font-weight:800;color:var(--text);text-align:end;word-break:break-word;min-width:0;}
.row dd.num{font-size:15.5px;font-weight:700;}
/* English text in an Arabic card: the direction comes from the text itself, so
   "TITAN2 (NCM)" keeps its closing bracket at the end. The side is spelled
   out, because `end` would follow the text's own direction and push a second
   line away from where every other value sits. */
.row dd.ltr{unicode-bidi:plaintext;text-align:left;}
html[dir="ltr"] .row dd.ltr{text-align:right;}
.row dd.warn{color:var(--warning);}
.row dd.bad{color:var(--danger);}

/* photos — separate panels, only slightly inset */
.shots{padding:0 14px 16px;margin-top:15px;display:flex;flex-direction:column;gap:9px;}
.shot{
  position:relative;margin:0;overflow:hidden;border-radius:var(--r);
  background:#f7fafd;border:1px solid #cdd7e2;
}
.shot img{display:block;width:100%;height:auto;cursor:zoom-in;}
.noshot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  aspect-ratio:16/10;background:var(--tint);color:var(--neutral);
}
.noshot span{font-size:14px;font-weight:800;}
.noshot svg{opacity:.5;}

/* lightbox */
#zoom{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.94);}
#zoom.on{display:flex;}
#zoom img{max-width:100%;max-height:88dvh;border-radius:var(--r);}
#zoom button{
  position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);
  background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;
}


/* ============================================================
   THE PERMITS CARD — copied from permits/index.html, rule for rule.
   Its colours and sizes are the permits system's own, so they are set on the
   wrapper each of its cards sits in and reach nothing else on the page.
   ============================================================ */
.pc{
  /* Brand, taken from the NCM wordmark */
  --blue:#1565C0;
  --blue-deep:#0E4C93;
  --green:#4BA548;
  --grey:#3B4A5C;

  --page:#EDF2F8;
  --card:#FFFFFF;
  --field:#F3F7FB;
  --tint:#E6EEF8;
  --line:#D2DEEC;
  --line-soft:#E2E9F2;
  --edge:#C0D3EC;

  --ink:#0B1114;
  --ink-2:#2A3238;

  --ok:#12874F;      --ok-bg:#DFF3E7;    --ok-br:#8FD3AE;
  --soon:#B96E08;    --soon-bg:#FCEBD5;  --soon-br:#EFC383;
  --bad:#C22F2F;     --bad-bg:#FBE3E3;   --bad-br:#EFA9A9;
  --ban:#A31515;     --ban-bg:#F6D6D6;   --ban-br:#E08A8A;
  --unclear:#5A646C; --unclear-bg:#EDF0F3; --unclear-br:#CBD3DB;

  --topbar-h:66px;

  /* Ported from the sister app: translucent card over the page, and the mono
     face it uses for figures. */
  --card-glass:rgba(172,188,206,.6);
  --card-line:#b3c2d4;
  --row-bg:rgba(255,255,255,.82);
  --row-line:#c7d3e0;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  /* Light blue shared by the send-date and ASE DATA boxes */
  --sky:#A9CCEE;
  --sky-line:#7BAADD;

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
/* Bump ACCESS_VERSION to lock every device that is already unlocked. It has to
   be the same number in all four files: the shell at the app root, the
   employees system, the permits system, and this one. */
const ACCESS_VERSION = "3";   // must match the shell at the app root
const UNLOCK_KEY = "ncm_device_unlocked";
const AUTH_KEY   = "ncm_key";
const SUPABASE_URL = "https://ljcalgumlodehoulbwtp.supabase.co";
const BUCKET = "employee-photos";
const EXPIRY_WINDOW = 30;                 // days that count as "expiring soon" — the app's number
const SHEET_ID = "1ZceJtmQMpW7Ky3Ysgz0mDcmE6Uxr600OuO2KOMHJnWE";
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/" + SHEET_ID;
const GVIZ_BASE = SHEET_BASE + "/gviz/tq?tqx=out:csv&sheet=";
const INDIVIDUALS_TAB = "تصاريح أفراد ";   // the trailing space is part of the tab's real name
const VEHICLES_TAB    = "تصاريح مركبات";

const $ = id => document.getElementById(id);
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ============================================================
   LANGUAGE — read from the home screen's choice, never changed here.
   These are only the words the page says itself; each card brings its own
   system's wording with it. The page stays right-to-left in both languages,
   as the permits system does.
   ============================================================ */
const I18N = {
  ar:{
    page:"بحث متكرر", segPeople:"أفراد", segVehicles:"مركبات", search:"بحث", clear:"مسح", lines:n => "سطور: " + n,
    ariaNids:"الأرقام القومية، رقم في كل سطر", ariaPlates:"أرقام السيارات، رقم في كل سطر",
    refresh:"تحديث البيانات", histAria:"سجل البحث", histEmpty:"السجل فاضي", histClear:"مسح السجل",
    srcEmp:"الموظفين", srcInd:"تصاريح الأفراد", srcVeh:"تصاريح المركبات", stillLoading:"البيانات لسه بتحمّل، استنى ثانية وجرّب تاني.",
    sumAsked:"مطلوب", sumFound:"موجود", sumMiss:"مش موجود", sumDup:"متكرر في القايمة",
    searchLacks:x => x + " مش متحمّل دلوقتي — النتايج دي من غيره، و«مش موجود» مش أكيدة", and:" و",
    missRow:"مش موجود في الشيت", moreNames:(term, n) => "«" + term + "» — " + n + " كمان",
    moreRow:(term, n) => "«" + term + "» — " + n + " نتيجة كمان",
    cOk:"ساري", cSoon:"قرب الانتهاء", cExpired:"منتهي", cBan:"منع", cRenew:"تجديد", cTemp:"مؤقت",
    cPending:"في انتظار الرد", cUndet:"غير محدد"
  },
  en:{
    page:"List search", segPeople:"People", segVehicles:"Vehicles", search:"Search", clear:"Clear", lines:n => "Lines: " + n,
    ariaNids:"National IDs, one per line", ariaPlates:"Plate numbers, one per line",
    refresh:"Refresh data", histAria:"Search history", histEmpty:"No history yet", histClear:"Clear history",
    srcEmp:"Employees", srcInd:"Individual permits", srcVeh:"Vehicle permits", stillLoading:"Data is still loading — wait a moment and try again.",
    sumAsked:"Asked", sumFound:"Found", sumMiss:"Not found", sumDup:"Repeated in the list",
    searchLacks:x => x + " is not loaded right now — these answers are without it, and a “Not found” is not certain", and:" and ",
    missRow:"Not in the sheet", moreNames:(term, n) => "“" + term + "” — " + n + " more",
    moreRow:(term, n) => "“" + term + "” — " + n + " more results",
    cOk:"Valid", cSoon:"Expiring soon", cExpired:"Expired", cBan:"Banned", cRenew:"Renewal", cTemp:"Temporary",
    cPending:"Awaiting response", cUndet:"Undetermined"
  }
};
let LANG = "ar";
try{ const saved = localStorage.getItem("ncm_lang"); if(saved === "en" || saved === "ar") LANG = saved; }catch(e){}
function t(key){
  let v = I18N[LANG][key];
  if(v === undefined) v = I18N.ar[key];
  if(typeof v === "function") return v.apply(null, [].slice.call(arguments, 1));
  return v === undefined ? key : v;
}

/* ============================================================
   TEXT AND DATES — the rules both other systems keep, word for word.
   ============================================================ */
function toLatinDigits(s){
  return String(s)
    .replace(/[٠-٩]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 48))
    .replace(/[۰-۹]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x06F0 + 48));
}
function normalize(s){
  if(s === null || s === undefined) return "";
  return toLatinDigits(String(s)).replace(/\s+/g, " ").trim();
}
function clean(s){ return (s === null || s === undefined) ? "" : String(s).trim(); }
function digitsOnly(s){ return normalize(s).replace(/[^\d]/g, ""); }
/* One shape per Arabic letter, for MATCHING only — the same folding the
   permits system does. What is shown is always what the sheet says. */
function foldArabic(s){
  return normalize(s)
    .replace(/[ً-ْٰ]/g, "")
    .replace(/ـ/g, "")
    .replace(/[أإآ]/g, "ا")
    .replace(/[ىئ]/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/\s+/g, "")
    .toLowerCase();
}
const pad2 = n => String(n).padStart(2, "0");
function today0(){ const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function mkDate(y, m, d){
  if(y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d); dt.setHours(0, 0, 0, 0);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
function fmt(dt){ return pad2(dt.getDate()) + "/" + pad2(dt.getMonth() + 1) + "/" + dt.getFullYear(); }
// The permits sheet: a leading date, day first unless that is impossible,
// with whatever was typed after it kept as a note ("18-11-2025(ABNA SINA)").
const LEADING_DATE = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/;
function parseLoose(v){
  const s = normalize(v), m = s.match(LEADING_DATE);
  if(!m) return null;
  const a = +m[1], b = +m[2], y = +m[3];
  let day, month;
  if(b > 12 && a <= 12){ month = a; day = b; } else { day = a; month = b; }
  const date = mkDate(y, month, day);
  if(!date) return null;
  const rest = s.slice(m[0].length).replace(/^[\s\-\/(),.:؛;]+/, "").replace(/[)\]]+$/, "").trim();
  return { date, text: fmt(date), rest };
}
function daysTo(dt){
  const d = today0();
  return Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) -
                     Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
}

/* ============================================================
   EMPLOYEES — who they are and how they are found. What a man's permit
   stands at is not worked out here: his card does that, with the employees
   system's own statusOf (inside EMP_CARD, below).
   ============================================================ */
// only what a line of the list is matched against; the card reads the whole row
const EMP_FIELDS = ["emp_code","full_name","full_name_en","national_id"];
function byCode(a, b){
  const x = parseInt(digitsOnly(a.emp_code), 10), y = parseInt(digitsOnly(b.emp_code), 10);
  if(isNaN(x) && isNaN(y)) return 0;
  if(isNaN(x)) return 1;
  if(isNaN(y)) return -1;
  return x - y;
}
function buildEmployees(rows){
  const list = [], seen = new Set();
  rows.forEach(r => {
    if(!r) return;
    const e = {};
    EMP_FIELDS.forEach(k => { e[k] = clean(r[k]); });
    e.raw = r;                                                   // the row as the table has it: what the employee card is drawn from
    if(!e.emp_code || seen.has(e.emp_code)) return;
    seen.add(e.emp_code);
    e.foreign  = !(e.national_id.length === 14 && /^[0-9]+$/.test(e.national_id));   // a passport, not a national id: nothing to link by
    e.nid      = digitsOnly(e.national_id);
    list.push(e);
  });
  list.sort(byCode);
  const byCodeMap = new Map(), byNid = new Map();
  list.forEach(e => {
    byCodeMap.set(e.emp_code, e);
    if(!e.foreign){ if(!byNid.has(e.nid)) byNid.set(e.nid, []); byNid.get(e.nid).push(e); }
  });
  return { list, byCode: byCodeMap, byNid };
}

/* ============================================================
   PERMITS — columns are read by position, exactly as the permits system does.
   ============================================================ */
const IND_COL = { NAME:2, JOB:3, ID:4, ADDR:5, NOTE:6, SENDER:7, PERMIT:8, DAY:9, MAIL:10, LETTER:11 };   // from LETTER on is ASE DATA, read by its headers
const VEH_COL = { PLATE:2, TYPE:3, OWNER:4, PERMIT:5, DAY:6, MAIL:7 };
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
/* Where a permit stands, from what is written in its cell. `auto` marks the
   two wordings that are the system's own and not the sheet's, so the page can
   say them in whichever language it is showing. */
function classify(rawValue){
  const s = normalize(rawValue);
  if(s === "") return { cat:"pending", cls:"warn", main:"في انتظار الرد", auto:"pending", note:"", date:null, dl:null };
  if(/^[؟?]+$/.test(s.replace(/\s+/g, ""))) return { cat:"undet", cls:"mute", main:"غير محدد موقفه حتى الآن", auto:"undet", note:"", date:null, dl:null };
  if(s.includes("منع")) return { cat:"ban", cls:"ban", main:s, note:"", date:null, dl:null };
  if(RENEW_WORDS.some(w => s.includes(w))) return { cat:"renew", cls:"bad", main:s, note:"", date:null, dl:null };
  if(s.includes("مؤقت")) return { cat:"temp", cls:"mute", main:s, note:"", date:null, dl:null };
  const p = parseLoose(s);
  if(p){
    const dl = daysTo(p.date);
    return { cat: dl < 0 ? "expired" : dl <= EXPIRY_WINDOW ? "soon" : "ok",
             cls: dl < 0 ? "bad" : dl <= EXPIRY_WINDOW ? "warn" : "ok",
             main: p.text, note: p.rest, date: p.date, dl };
  }
  if(s.includes("انتظار")) return { cat:"pending", cls:"warn", main:s, note:"", date:null, dl:null };
  return { cat:"undet", cls:"mute", main:s, note:"", date:null, dl:null };
}
/* Dated first in order, undated after them; the LAST one is the one that
   counts. The day is read by the permits system's own reader (PER_CARD.dayOf),
   so the permit counted here is always the one its card opens on. */
function sortByDay(records){
  return records.slice().sort((a, b) => {
    if(a.dayParsed && b.dayParsed) return a.dayParsed - b.dayParsed;
    if(a.dayParsed) return -1;
    if(b.dayParsed) return 1;
    return 0;
  });
}
function buildIndividuals(rows){
  const C = IND_COL, groups = new Map();
  rows.forEach(c => {
    if(!c || c.length < 5) return;
    const idVal = normalize(c[C.ID]), nameVal = normalize(c[C.NAME]);
    if(!idVal && !nameVal) return;
    const key = idVal ? "ID:" + digitsOnly(idVal) : "NAME:" + nameVal;
    if(!groups.has(key)) groups.set(key, { key, name: nameVal, nationalId: idVal, nid: digitsOnly(idVal), records: [], names: new Map() });
    const g = groups.get(key);
    const f = foldArabic(nameVal);
    if(f && !g.names.has(f)) g.names.set(f, nameVal);
    // one permit: the fields the permits card reads, under the names it reads them by
    g.records.push({
      job: normalize(c[C.JOB]), address: normalize(c[C.ADDR]), note: normalize(c[C.NOTE]),
      sender: normalize(c[C.SENDER]), mailType: normalize(c[C.MAIL]), ase: PER_CARD.aseValues(c),
      permit: c[C.PERMIT], day: c[C.DAY], dayParsed: PER_CARD.dayOf(c[C.DAY]),
      p: classify(c[C.PERMIT])                                   // where it stands, for the count above the answers
    });
  });
  const list = [], byNid = new Map();
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    if(g.nid) byNid.set(g.nid, g);
    list.push(g);
  });
  return { list, groups, byNid };
}
function buildVehicles(rows){
  const C = VEH_COL, groups = new Map();
  rows.forEach(c => {
    if(!c || c.length < 3) return;
    const plate = normalize(c[C.PLATE]);
    if(!plate) return;
    const key = foldArabic(plate);
    if(!groups.has(key)) groups.set(key, { key, plate, records: [] });
    const g = groups.get(key);
    g.records.push({
      type: normalize(c[C.TYPE]), owner: normalize(c[C.OWNER]), mailType: normalize(c[C.MAIL]),
      permit: c[C.PERMIT], day: c[C.DAY], dayParsed: PER_CARD.dayOf(c[C.DAY]),
      p: classify(c[C.PERMIT])
    });
  });
  const list = [];
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    list.push(g);
  });
  return { list, groups };
}
/* The model the search reads: each source there or not, and the two that hold
   people tied together by national id — so a man who is in both is one answer. */
const M = { emp: null, ind: null, veh: null };
function linkModel(){
  if(M.emp) M.emp.list.forEach(e => { e.per = (M.ind && !e.foreign) ? (M.ind.byNid.get(e.nid) || null) : null; });
  if(M.ind) M.ind.list.forEach(g => { g.emp = (M.emp && g.nid && M.emp.byNid.get(g.nid)) || null; });
}

/* ============================================================
   LOADING
   The employees come from the table with the key the home screen unsealed;
   the permits from the sheet's CSV export, tab by tab, the gid looked up fresh
   by the tab's name - both exactly as the two systems read them. The three are
   asked for at once and each arrives on its own, so a slow sheet does not hold
   the employees back; the row of marks under the box says which are in.
   ============================================================ */
let sb = null;
const SRC = { emp:"wait", ind:"wait", veh:"wait" };       // wait | ok | bad
function paintSrc(){
  const one = (k, name) => '<span class="pill ' + (SRC[k] === "ok" ? "ok" : SRC[k] === "bad" ? "bad" : "wait") + '"><span class="dot"></span>' + esc(t(name)) + "</span>";
  $("src").innerHTML = one("emp", "srcEmp") + one("ind", "srcInd") + one("veh", "srcVeh");
}
/* The table answers a plain select with its first 1000 rows and says nothing
   about the rest, so it is read a page at a time, in id order (see the
   employees system for the long version of why). */
async function fetchAllEmployees(){
  const rows = [], PAGE = 1000;
  for(let from = 0; ; from += PAGE){
    const { data, error } = await sb.from("employees").select("*").order("id", { ascending: true }).range(from, from + PAGE - 1);
    if(error) throw error;
    const page = data || [];
    rows.push(...page);
    if(page.length < PAGE) return rows;
  }
}
let tabGidsPromise = null;
function loadTabGids(){
  if(!tabGidsPromise){
    tabGidsPromise = fetch(SHEET_BASE + "/htmlview?_=" + Date.now(), { cache:"no-store" })
      .then(r => r.ok ? r.text() : Promise.reject(new Error("htmlview " + r.status)))
      .then(html => {
        const map = new Map();
        const re = /items\.push\(\{name: "((?:[^"\\]|\\.)*)"[\s\S]*?gid: "(\d+)"/g;
        let m;
        while((m = re.exec(html))){
          try{ map.set(JSON.parse('"' + m[1].replace(/\\x([0-9a-fA-F]{2})/g, "\\u00$1") + '"'), m[2]); }catch(e){}
        }
        return map;
      });
    tabGidsPromise.catch(() => { tabGidsPromise = null; });
  }
  return tabGidsPromise;
}
async function tabCsvUrl(name){
  try{
    const gids = await loadTabGids();
    if(gids.has(name)) return SHEET_BASE + "/export?format=csv&gid=" + gids.get(name);
  }catch(e){ console.warn("tab gids unavailable, falling back to gviz", e); }
  return GVIZ_BASE + encodeURIComponent(name);
}
function loadCSV(url){
  const busted = url + (url.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();
  return new Promise((resolve, reject) => {
    Papa.parse(busted, { download:true, header:false, skipEmptyLines:false,
      complete: res => resolve(res.data), error: err => reject(err) });
  });
}
let loadRun = 0;
function loadAll(){
  const run = ++loadRun;
  SRC.emp = SRC.ind = SRC.veh = "wait";
  tabGidsPromise = null;                    // an upload since the last load gave the tabs new gids
  paintSrc();
  const done = (k, model) => {
    if(run !== loadRun) return;
    M[k] = model; SRC[k] = model ? "ok" : "bad";
    linkModel(); paintSrc();
    if(st.res) { runMulti(); paintMulti(); }           // an answer on screen is asked again with what has just come in
  };
  const emp = fetchAllEmployees().then(rows => done("emp", buildEmployees(rows)), err => { console.error("[NCM] employees", err); done("emp", null); });
  const ind = tabCsvUrl(INDIVIDUALS_TAB).then(loadCSV).then(rows => { PER_CARD.setAseColumns(rows[0] || []); done("ind", buildIndividuals(rows.slice(1))); }, err => { console.error("[NCM] individuals", err); done("ind", null); });
  const veh = tabCsvUrl(VEHICLES_TAB).then(loadCSV).then(rows => done("veh", buildVehicles(rows.slice(1))), err => { console.error("[NCM] vehicles", err); done("veh", null); });
  return Promise.all([emp, ind, veh]);
}

/* ============================================================
   THE SEARCH
   ============================================================ */
const st = { mode: "ind", text: "", res: null };
const MULTI_CAP = 5000;        // per line: more than either sheet holds, so everything a line finds is shown — a guard, not a limit anyone meets
const NAME_SHOW = 50;          // of a name that finds more people than this, this many are listed and the rest are counted

/* The written list, one entry each. A new line splits, and so do a comma, a
   semicolon and a tab, because that is how a list arrives when it is pasted
   out of a message or a sheet. An entry written twice is asked once and counted. */
function parseTerms(text){
  const terms = [], seenT = new Set(); let dup = 0;
  toLatinDigits(text || "").split(/[\n\r,;،\t]+/).forEach(piece => {
    let parts = [piece.trim()];
    /* Digits with gaps on one line are either several ids pasted side by side
       or one id typed with a space in it. Fourteen digits in all is one
       national id however it was spaced ("2990102 2020231" is a man, not two
       half-numbers); otherwise pieces long enough to stand alone are separate
       entries, and anything else is one number with stray spaces. */
    if(/^[\d\s]+$/.test(parts[0]) && /\s/.test(parts[0])){
      const toks = parts[0].split(/\s+/), joined = toks.join("");
      parts = joined.length === 14 ? [joined] : toks.every(x => x.length >= 5) ? toks : [joined];
    }
    parts.forEach(p => {
      p = normalize(p);
      if(!p) return;
      const k = foldArabic(p);
      if(seenT.has(k)){ dup++; return; }
      seenT.add(k); terms.push(p);
    });
  });
  return { terms, dup };
}
const capped = all => ({ list: all.slice(0, MULTI_CAP), more: Math.max(0, all.length - MULTI_CAP) });
// what was typed, a word at a time, folded the way names and plates are folded for matching
const wordsOf = term => term.split(/\s+/).map(w => foldArabic(w)).filter(Boolean);
function findPeople(term){
  const d = digitsOnly(term), f = foldArabic(term), numeric = /^[\d\s-]+$/.test(term);
  const hits = [], seenG = new Set(), seenE = new Set();
  // a man who is in both sources is one row, not two
  const addG = g => {
    if(seenG.has(g.key)) return;
    seenG.add(g.key);
    (g.emp || []).forEach(e => seenE.add(e.emp_code));
    hits.push({ g, emps: g.emp || [] });
  };
  const addE = e => {
    if(seenE.has(e.emp_code)) return;
    if(e.per) return addG(e.per);
    seenE.add(e.emp_code);
    hits.push({ g: null, emps: [e] });
  };
  if(numeric){
    if(d.length === 14){
      const g = M.ind && M.ind.byNid.get(d);
      if(g) addG(g);
      ((M.emp && M.emp.byNid.get(d)) || []).forEach(addE);
    }else{
      // a short number is an employee's code, whole; five digits and up is also looked for inside every national id
      const byC = M.emp && M.emp.byCode.get(d);
      if(byC) addE(byC);
      if(d.length >= 5){
        if(M.ind) M.ind.list.forEach(g => { if(g.nid && g.nid.includes(d)) addG(g); });
        if(M.emp) M.emp.list.forEach(e => { if(e.nid && e.nid.includes(d)) addE(e); });
      }
    }
  }else if(f){
    /* A NAME TYPED IN PART finds everyone it is part of. Every word typed has
       to be in the name, in any order and with anything between them — so
       «ابراهيم سالم» finds «ابراهيم احمد محمد سالم». All of them are shown,
       the closest first: the name that is exactly what was typed, then the
       names that hold it as it was typed, then the names that hold its words.
       A name as common as «محمد» finds hundreds: of those only the first
       NAME_SHOW are listed and the line ends by saying how many more there are. */
    const words = wordsOf(term), hasAll = s => words.every(w => s.includes(w));
    const en = e => e.full_name_en.toLowerCase().replace(/\s+/g, "");
    const rankG = g => {
      let best = 9;
      for(const n of g.names.keys()){ const r = n === f ? 0 : n.includes(f) ? 1 : hasAll(n) ? 2 : 9; if(r < best) best = r; }
      return best;
    };
    const rankE = e => {
      const a = foldArabic(e.full_name), b = en(e);
      return a === f || b === f || foldArabic(e.national_id) === f ? 0 : a.includes(f) || b.includes(f) ? 1 : hasAll(a) || hasAll(b) ? 2 : 9;
    };
    const found = [];
    if(M.ind) M.ind.list.forEach(g => { const r = rankG(g); if(r < 9) found.push({ r, name: g.name, add: () => addG(g) }); });
    if(M.emp) M.emp.list.forEach(e => { const r = rankE(e); if(r < 9) found.push({ r, name: e.full_name, add: () => addE(e) }); });
    found.sort((a, b) => a.r - b.r || foldArabic(a.name).localeCompare(foldArabic(b.name), "ar"));
    found.forEach(x => x.add());
    if(hits.length > NAME_SHOW) return { list: hits.slice(0, NAME_SHOW), more: hits.length - NAME_SHOW, names: true };
  }
  return capped(hits);
}
function findVehicles(term){
  if(!M.veh) return capped([]);
  const f = foldArabic(term), d = digitsOnly(term), numeric = /^[\d\s-]+$/.test(term);
  if(numeric){
    /* THE NUMBER ALONE, without the letters, finds every plate that has that
       number in it, whatever its letters. All of them are shown: the plate
       numbered exactly so first, then the plates whose number begins with
       it, then the rest. */
    if(!d) return capped([]);
    const rank = g => { const x = g.key.replace(/\D/g, ""); return x === d ? 0 : x.startsWith(d) ? 1 : 2; };
    return capped(M.veh.list.filter(g => g.key.includes(d)).map(g => ({ g, r: rank(g) }))
      .sort((a, b) => a.r - b.r || a.g.key.localeCompare(b.g.key, "ar")).map(x => ({ g: x.g })));
  }
  const exact = M.veh.groups.get(f);
  if(exact) return capped([{ g: exact }]);
  // letters, or letters and numbers, typed in part: every piece typed has to be in the plate
  const words = wordsOf(term);
  return capped(M.veh.list.filter(g => g.key.includes(f) || words.every(w => g.key.includes(w))).map(g => ({ g })));
}
function runMulti(){
  const parsed = parseTerms(st.text), rows = [];
  let found = 0;
  parsed.terms.forEach((term, i) => {
    const hits = st.mode === "veh" ? findVehicles(term) : findPeople(term);
    if(!hits.list.length){ rows.push({ n: i + 1, term, miss: true }); return; }
    found++;
    hits.list.forEach(h => rows.push(Object.assign({ n: i + 1, term }, h)));
    if(hits.more) rows.push({ n: i + 1, term, more: hits.more, names: !!hits.names });
  });
  st.res = { rows, mode: st.mode, terms: parsed.terms.length, dup: parsed.dup, found, miss: parsed.terms.length - found };
}

const num = s => '<span class="num">' + esc(s) + "</span>";
const pill = (cls, text) => '<span class="pill ' + cls + '">' + esc(text) + "</span>";
const CAT_PILL = { ok:"ok", soon:"warn", expired:"bad", ban:"ban", renew:"bad", temp:"mute", pending:"warn", undet:"mute" };
const CAT_NAME = { ok:"cOk", soon:"cSoon", expired:"cExpired", ban:"cBan", renew:"cRenew", temp:"cTemp", pending:"cPending", undet:"cUndet" };
/* Everything one answer is, in full, in the cards of the systems it comes
   from: the employee's card for the employee he is, and the permits card for
   what the sheet holds on him - the newest permit showing, the others one tap
   away on its numbered buttons, exactly as in the permits system. */
function hitNode(r, veh){
  const hit = document.createElement("div");
  hit.className = "hit";
  if(!veh && r.emps.length) hit.innerHTML = r.emps.map(e => EMP_CARD.recordHTML(e.raw)).join("");
  if(r.g){
    const pc = document.createElement("div");
    pc.className = "pc";
    if(veh) PER_CARD.renderVehicleCard(r.g, pc); else pc.appendChild(PER_CARD.personCard(r.g));
    hit.appendChild(pc);
  }
  return hit;
}
function paintMulti(){
  const res = st.res, box = $("mres");
  box.innerHTML = "";
  if(!res || !res.terms) return;                                   // nothing asked, nothing shown
  const cats = {};
  res.rows.forEach(r => { if(r.g) cats[r.g.p.cat] = (cats[r.g.p.cat] || 0) + 1; });
  /* An answer is only as whole as the sources behind it. With the permits not
     loaded, a man who is banned comes back "not found" (or as an employee and
     nothing more) — so the answers say which source they are without. */
  const lacking = res.mode === "veh" ? (M.veh ? [] : ["srcVeh"]) : [M.ind ? "" : "srcInd", M.emp ? "" : "srcEmp"].filter(Boolean);
  box.insertAdjacentHTML("beforeend",
    (lacking.length ? '<div class="note warn">' + esc(t("searchLacks", lacking.map(k => t(k)).join(t("and")))) + "</div>" : "") +
    '<div class="sum">' +
      '<span class="pill white">' + t("sumAsked") + " " + num(res.terms) + "</span>" +
      '<span class="pill ok">' + t("sumFound") + " " + num(res.found) + "</span>" +
      (res.miss ? '<span class="pill bad">' + t("sumMiss") + " " + num(res.miss) + "</span>" : "") +
      (res.dup ? '<span class="pill">' + t("sumDup") + " " + num(res.dup) + "</span>" : "") +
      Object.keys(CAT_PILL).filter(k => cats[k]).map(k => '<span class="pill ' + CAT_PILL[k] + '">' + t(CAT_NAME[k]) + " " + num(cats[k]) + "</span>").join("") +
    "</div>");
  let line = 0;
  res.rows.forEach(r => {
    // each line of the list is named once, above whatever it found
    if(r.n !== line){
      box.insertAdjacentHTML("beforeend", '<div class="mterm"><span class="mrow-n">' + r.n + '</span><span class="term">' + esc(r.term) + "</span></div>");
      line = r.n;
    }
    if(r.miss) return box.insertAdjacentHTML("beforeend", '<div class="mrow miss">' + pill("bad", t("missRow")) + "</div>");
    if(r.more) return box.insertAdjacentHTML("beforeend", '<div class="mrow more">' + esc(t(r.names ? "moreNames" : "moreRow", r.term, r.more)) + "</div>");
    box.appendChild(hitNode(r, res.mode === "veh"));
  });
}
function multiLines(){
  $("mt-n").textContent = t("lines", parseTerms($("mt").value).terms.length);
}
function goMulti(){
  st.text = $("mt").value;

}

function isEN(){ return lang === 'en'; }

function parseDate(v){
  if(v === null || v === undefined) return null;
  if(v instanceof Date) return isNaN(v.getTime()) ? null : v;
  const s = String(v).trim();
  if(!s) return null;

  let d, m, y, hit;
  if((hit = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))){       // dd/mm/yyyy
    d = +hit[1]; m = +hit[2]; y = +hit[3];
  } else if((hit = s.match(/^(\d{4})[\-\/.](\d{1,2})[\-\/.](\d{1,2})/))){ // yyyy-mm-dd
    y = +hit[1]; m = +hit[2]; d = +hit[3];
  } else {
    return null;
  }
  if(y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d);
  dt.setHours(0,0,0,0);
  // Rejects impossible dates like 31/02 that would silently roll over.
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
function fmtDate(v){
  const dt = parseDate(v);
  if(!dt) return null;
  const p = n => String(n).padStart(2,'0');
  return p(dt.getDate()) + '/' + p(dt.getMonth()+1) + '/' + dt.getFullYear();
}
function today0(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
// Whole-day difference computed from calendar values, so DST can't shift it.
function daysLeft(v){
  const dt = parseDate(v);
  if(!dt) return null;
  const a = Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const t = today0();
  const b = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((a - b) / 86400000);
}
// Digits are wrapped so they always render in the Latin monospace face,
// never in the Arabic-Indic forms the body font would otherwise reach for.
function numHTML(n){ return '<span class="num">' + n + '</span>'; }

function daysWord(n){
  n = Math.abs(n);
  if(isEN()) return n === 1 ? numHTML(1) + ' day' : numHTML(n) + ' days';
  if(n === 1) return 'يوم واحد';
  if(n === 2) return 'يومين';
  if(n >= 3 && n <= 10) return numHTML(n) + ' أيام';
  return numHTML(n) + ' يوم';
}
function countdownText(dl){
  if(dl === null) return null;
  if(isEN()){
    if(dl === 0) return 'Expires today';
    if(dl < 0)   return 'Expired ' + daysWord(dl) + ' ago';
    return daysWord(dl) + ' left';
  }
  if(dl === 0)  return 'ينتهي اليوم';
  if(dl < 0)    return 'منتهي منذ ' + daysWord(dl);
  return 'متبقي ' + daysWord(dl);
}

   STATUS — the permit DATE is authoritative over the stored label,

   ============================================================ */
// Any value in the resignation column counts, not just a readable date:
// some rows carry "غير محدد", and those people have still left.
function isResigned(emp){
  return !!(emp && emp.resignation_end_date && String(emp.resignation_end_date).trim());
}
// Shows the date when there is one, otherwise the stored wording itself.
function resignEnd(v){
  if(v === null || v === undefined) return null;
  const raw = String(v).trim();
  if(!raw) return null;
  const asDate = fmtDate(raw);
  if(asDate) return {text:asDate, cls:'num warn'};
  return {text: raw === 'غير محدد' ? t('notSpecified') : raw, cls:'warn'};
}

function statusOf(emp){
  const raw = (emp && emp.permit_status ? String(emp.permit_status) : '').trim();
  const dl  = daysLeft(emp && emp.permit_date);

  // The raw values below are the ones stored in the database and are
  // matched as-is in both languages; only the shown label changes.
  if(raw === 'ممنوع') return {k:'bad', label:t('stBanned'), code:'BANNED'};

  // Someone who left has a permit that is either still running or over: no
  // "expiring soon" to chase, no "no date" or "no permit" to puzzle over.
  if(isResigned(emp)){
    if(raw === 'ساري' && dl !== null && dl >= 0) return {k:'ok', label:t('stValid'), code:'VERIFIED'};
    return {k:'bad', label:t('stExpired'), code:'EXPIRED'};
  }

  if(raw === 'ساري'){
    // Foreign staff carry this exact wording where a date would go — not a
    // missing date but a decision that the permit runs until they resign,
    // so it reads as any other valid permit rather than the muted "no date".
    const pd = (emp && emp.permit_date !== null && emp.permit_date !== undefined)
                 ? String(emp.permit_date).trim() : '';
    if(pd === 'ساري حتى الاستقالة') return {k:'ok', label:t('stValid'), code:'VERIFIED'};
    if(dl === null)        return {k:'mute', label:t('stNoDate'),   code:'NO DATE'};
    if(dl < 0)             return {k:'bad',  label:t('stExpired'),  code:'EXPIRED'};
    if(dl <= EXPIRY_WINDOW)return {k:'warn', label:t('stExpiring'), code:'EXPIRING'};
    return {k:'ok', label:t('stValid'), code:'VERIFIED'};
  }
  if(raw === 'منتهي الصلاحية') return {k:'bad', label:t('stExpired'), code:'EXPIRED'};
  if(raw === 'بدون تصريح' || raw === '') return {k:'mute', label:t('stNoPermit'), code:'NO PERMIT'};
  // Anything unexpected is surfaced as-is rather than silently relabelled.
  return {k:'mute', label:raw, code:'UNKNOWN'};
}

const IN_WEBVIEW = /; wv\)/.test(navigator.userAgent);
function androidBridge(){
  const b = window.NCMAndroid;
  return b && typeof b.download === 'function' ? b : null;
}
async function grab(url, name){
  const bridge = androidBridge();
  if(bridge){
    const head = await fetch(url, {method:'HEAD'});
    if(!head.ok) return false;               // a missing second photo is normal
    return bridge.download(url, name) === true;
  }
  const res = await fetch(url);
  if(!res.ok) return false;                 // a missing second photo is normal
  const obj = URL.createObjectURL(await res.blob());
  const a = document.createElement('a');
  a.href = obj;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(obj), 5000);
  return true;
}
async function saveBoth(btn){
  if(btn.disabled) return;
  const code = btn.dataset.dl;
  const label = btn.querySelector('span');
  if(IN_WEBVIEW && !androidBridge()){
    btn.classList.add('fail');
    label.textContent = t('dlUpdateApp');
    return;
  }
  btn.disabled = true;
  btn.classList.remove('done','fail');
  label.textContent = t('downloading');
  let saved = 0;
  for(const second of [false, true]){
    try{
      if(await grab(photoURL(code, second), code + (second ? '_2' : '') + '.jpg')) saved++;
    }catch(err){ console.error('[NCM] download', err); }
    if(!second) await new Promise(r => setTimeout(r, 500));   // browsers throttle bursts
  }
  btn.classList.add(saved ? 'done' : 'fail');
  label.textContent = saved ? t('downloaded') : t('downloadFail');
  setTimeout(() => {
    btn.classList.remove('done','fail');
    label.textContent = t('download');
    btn.disabled = false;
  }, 2200);
}

const PERMIT_PHRASE_EN = [
  ["الرخصه منتهيه","License expired"],
  ["الرخصة منتهية","License expired"],
  ["غيرت لوحات عايزة جديد","Plates changed - new permit required"],
  ["غيرت لوحات","Plates changed"],
  ["عايز تجديد","Renewal required"],
  ["تجديد","Renewal"],
  ["مؤقت","Temporary"],
  ["منع","Banned"]
];

const BAN_WORDS = ["منع"];
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
const TEMP_WORDS = ["مؤقت"];
const QUESTION_MARKS_ONLY = /^[؟?]+$/;
const LEADING_DATE = /^(\d{1,2})([-\/])(\d{1,2})[-\/](\d{4})/;

/* Dates arrive day-first: "18-11-2025" typed by hand, and "30/11/2025" from
   real date cells, which the upload gives an explicit dd/mm/yyyy format.
   Before that format was set (until 2026-09-16) Google showed and exported
   real dates month-first, so a permit ending 5 March read as 3 May. A slash
   date whose second number is over 12 is still read month-first, because
   day-first is impossible there - otherwise JS rolls month 30 into 2028 and
   paints an expired permit green. */
function parseDateParts(s){
  const m = normalize(s).match(LEADING_DATE);
  if(!m) return null;

  const a = parseInt(m[1],10);
  const sep = m[2];
  const b = parseInt(m[3],10);
  const year = parseInt(m[4],10);

  let day, month;
  // The sheet is normalised to day-first (dd/mm/yyyy). Only read month-first
  // when day-first is impossible, which is what a legacy US-order export looks
  // like. `sep` is kept for that older shape.
  if(b > 12 && a <= 12){ month = a; day = b; }
  else { day = a; month = b; }

  if(month < 1 || month > 12 || day < 1 || day > 31) return null;
  const d = new Date(year, month-1, day);
  if(isNaN(d.getTime()) || d.getMonth() !== month-1 || d.getDate() !== day) return null;

  return { date:d, day, month, year, matched:m[0] };
}

function parseDateLoose(v){
  const p = v ? parseDateParts(v) : null;
  return p ? p.date : null;
}

const pad2 = n => String(n).padStart(2,"0");

/* Splits a cell into a tidy dd/mm/yyyy date plus whatever text trailed it,
   so "18-11-2025(ABNA SINA)" shows the date on one line and the note below. */
function splitDateAndNote(v){
  const s = normalize(v);
  if(!s) return { date:null, note:"" };
  const p = parseDateParts(s);
  if(!p) return { date:null, note:s };
  const rest = s.slice(p.matched.length).replace(/^[\s\-\/(),.:؛;]+/,"").replace(/[)\]]+$/,"").trim();
  return { date:`${pad2(p.day)}/${pad2(p.month)}/${p.year}`, note:rest };
}

function classifyPermit(rawValue){
  const s = normalize(rawValue);
  if(s === "") return {kind:"pending", cls:"pb-soon", raw:s};

  const noSpaces = s.replace(/\s+/g,"");
  if(QUESTION_MARKS_ONLY.test(noSpaces)) return {kind:"undetermined", cls:"pb-unclear", raw:s};

  if(BAN_WORDS.some(w=>s.includes(w))) return {kind:"raw", cls:"pb-ban", raw:s};
  if(RENEW_WORDS.some(w=>s.includes(w))) return {kind:"raw", cls:"pb-bad", raw:s};
  if(TEMP_WORDS.some(w=>s.includes(w))) return {kind:"raw", cls:"pb-unclear", raw:s};

  const d = parseDateLoose(s);
  if(d){
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((d - today) / 86400000);
    if(diffDays < 0) return {kind:"raw", cls:"pb-bad", raw:s};
    if(diffDays <= 30) return {kind:"raw", cls:"pb-soon", raw:s};
    return {kind:"raw", cls:"pb-ok", raw:s};
  }
  return {kind:"raw", cls:"pb-unclear", raw:s};
}

function permitDisplay(p){
  if(p.kind === "pending") return { main:t("permitPending"), note:"" };
  if(p.kind === "undetermined") return { main:t("permitUndetermined"), note:"" };

  const parts = splitDateAndNote(p.raw);
  if(parts.date) return { main:parts.date, note:parts.note };

  if(LANG === "en"){
    for(const [ar, en] of PERMIT_PHRASE_EN){
      if(p.raw.includes(ar)) return { main:en, note:"" };
    }
  }
  return { main:p.raw, note:"" };
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/** Escape for display, with Arabic-Indic digits rewritten to 0-9. */
function disp(str){ return escapeHtml(toLatinDigits(String(str))); }

/** Wrap a value that is mostly digits so it always reads left-to-right. */
function dispNum(str){ return `<span class="num">${disp(str)}</span>`; }


// [{index, label}] describing the ASE DATA columns, filled from the sheet header.
let indAseColumns = [];
function setAseColumns(headerRow){
  indAseColumns = [];
  for(let c = IND_COL.LETTER; c < headerRow.length; c++){
    const label = normalize(headerRow[c]);
    if(label && !isHelperColumn(label)) indAseColumns.push({ index:c, label });
  }
}
const aseValues = cols => indAseColumns.map(col => normalize(cols[col.index]));
const dayOf = raw => parseDateLoose(raw);
const PERMIT_ICONS = {
  "pb-ok": '<path d="M20 6L9 17l-5-5"/>',
  "pb-soon": '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  "pb-bad": '<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/>',
  "pb-ban": '<circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/>',
  "pb-unclear": '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.7v.3"/><circle cx="12" cy="16.5" r="0.5" fill="currentColor"/>'
};

function attachOccurrenceSwitcher(card, chipsContainer, sorted, fieldsHtmlFn){
  const content = document.createElement("div");
  content.className = "occ-content";

  function renderContent(idx){
    const rec = sorted[idx];
    const p = classifyPermit(rec.permit);
    const icon = PERMIT_ICONS[p.cls] || PERMIT_ICONS["pb-unclear"];
    const shown = permitDisplay(p);
    const sent = splitDateAndNote(rec.day);

    const permitMain = shown.main && /^\d/.test(shown.main) ? dispNum(shown.main) : disp(shown.main);
    const sentMain = sent.date ? dispNum(sent.date) : disp(sent.note || t("notSpecified"));
    const sentNote = sent.date ? sent.note : "";

    content.innerHTML = `
      <div class="permit-banner ${p.cls}">
        <div class="pb-left">
          <div class="permit-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">${icon}</svg></div>
          <span class="pb-tag">${disp(t("permitTag"))}</span>
        </div>
        <div class="pb-body">
          <div class="pb-value">${permitMain}</div>
          ${shown.note ? `<div class="pb-extra">${disp(shown.note)}</div>` : ""}
        </div>
      </div>
      <div class="rows-group-title">NCM DATA</div>
      ${fieldsHtmlFn(rec, { sendMain: sentMain, sendNote: sentNote })}
    `;
  }

  const defaultIdx = sorted.length - 1;

  sorted.forEach((rec, i)=>{
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "occ-chip" + (i === defaultIdx ? " active" : "");
    chip.textContent = i + 1;
    chip.addEventListener("click", ()=>{
      chipsContainer.querySelectorAll(".occ-chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      renderContent(i);
    });
    chipsContainer.appendChild(chip);
  });

  renderContent(defaultIdx);
  card.appendChild(content);
}

/* The ASE DATA block: its own heading plus one row per sheet column, rendered
   only when at least one of those cells has a value. */
function aseBlockHtml(rec){
  const vals = rec.ase || [];
  const rows = indAseColumns.map((col, i) => {
    const v = vals[i];
    if(!v) return "";
    const shown = /^[0-9]/.test(v) ? dispNum(v) : disp(v);
    return `<div class="record-row"><span class="k">${disp(aseLabel(col.label))}</span><span class="v">${shown}</span></div>`;
  }).join("");
  if(!rows) return "";
  return `<div class="rows-group-title">ASE DATA</div><div class="record-rows">${rows}</div>`;
}

function sortByDay(records){
  return [...records].sort((a,b)=>{
    if(a.dayParsed && b.dayParsed) return a.dayParsed - b.dayParsed;
    if(a.dayParsed) return -1;
    if(b.dayParsed) return 1;
    return 0;
  });
}

/* One person's card: every permit he has, the newest showing. */
function personCard(g){
    const sorted = sortByDay(g.records);
    const card = document.createElement("div");
    card.className = "person-card";

    const head = document.createElement("div");
    head.className = "person-head";
    head.innerHTML = `
      <div class="record-top">
        <div class="occ-selector"></div>
        <div class="count-badge">${disp(t("permitCount", sorted.length))}</div>
      </div>
      <div class="record-identity">
        <div class="record-name">${disp(g.name || t("noName"))}</div>
        <div class="record-subid">${g.nationalId ? dispNum(g.nationalId) : disp(t("noId"))}</div>
      </div>
    `;
    card.appendChild(head);

    attachOccurrenceSwitcher(card, head.querySelector(".occ-selector"), sorted, (rec, sent) => `
      <div class="record-rows">
        <div class="record-row"><span class="k">${disp(t("sendDate"))}</span><span class="v">${sent.sendMain}${sent.sendNote ? " " + disp(sent.sendNote) : ""}</span></div>
        <div class="record-row"><span class="k">${disp(t("fieldJob"))}</span><span class="v">${disp(rec.job || "—")}</span></div>
        <div class="record-row"><span class="k">${disp(t("fieldAddress"))}</span><span class="v">${disp(rec.address || "—")}</span></div>
        <div class="record-row"><span class="k">${disp(t("fieldSender"))}</span><span class="v">${disp(rec.sender || "—")}</span></div>
        <div class="record-row"><span class="k">${disp(t("fieldNotes"))}</span><span class="v">${disp(rec.note || "—")}</span></div>
        ${rec.mailType ? `<div class="record-row"><span class="k">${disp(t("fieldMailType"))}</span><span class="v">${disp(rec.mailType)}</span></div>` : ""}
      </div>
      ${aseBlockHtml(rec)}
    `);

    return card;
}

function renderVehicleCard(g, resultsEl){
  const sorted = sortByDay(g.records);

  const card = document.createElement("div");
  card.className = "person-card";
  const head = document.createElement("div");
  head.className = "person-head";
  head.innerHTML = `
    <div class="record-top">
      <div class="occ-selector"></div>
      <div class="count-badge">${disp(t("permitCount", sorted.length))}</div>
    </div>
    <div class="record-identity">
      <div class="record-name" style="margin-bottom:0;">${disp(g.plate)}</div>
    </div>

  attachOccurrenceSwitcher(card, head.querySelector(".occ-selector"), sorted, (rec, sent) => `
    <div class="record-rows">
      <div class="record-row"><span class="k">${disp(t("sendDate"))}</span><span class="v">${sent.sendMain}${sent.sendNote ? " " + disp(sent.sendNote) : ""}</span></div>
      <div class="record-row"><span class="k">${disp(t("fieldType"))}</span><span class="v">${disp(rec.type || "—")}</span></div>
      <div class="record-row"><span class="k">${disp(t("fieldOwner"))}</span><span class="v">${disp(rec.owner || "—")}</span></div>
      ${rec.mailType ? `<div class="record-row"><span class="k">${disp(t("fieldMailType"))}</span><span class="v">${disp(rec.mailType)}</span></div>` : ""}
    </div>
  `);

  resultsEl.appendChild(card);
}


return { personCard, renderVehicleCard, setAseColumns, aseValues, dayOf };
})();

// a photograph that is not there (the second one often is not): the employee card's own placeholder
$("mres").addEventListener("error", e => {
  const img = e.target;
  if(img && img.tagName === "IMG" && img.hasAttribute("data-zoom")){
    const fig = img.closest(".shot");
    if(fig) fig.innerHTML = EMP_CARD.NOSHOT();
  }
}, true);
// the save button under the photographs, and a tap on a photograph to see it large
$("mres").addEventListener("click", e => {
  const btn = e.target.closest("button[data-dl]");
  if(btn) return EMP_CARD.saveBoth(btn);
  const img = e.target.closest("img[data-zoom]");
  if(img){ $("zoom-img").src = img.src; $("zoom").classList.add("on"); }
});
function closeZoom(){ $("zoom").classList.remove("on"); $("zoom-img").removeAttribute("src"); }
$("zoom").addEventListener("click", closeZoom);
$("zoom-x").addEventListener("click", closeZoom);
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("zoom").classList.contains("on")) closeZoom(); });

/* ============================================================
   SEARCH HISTORY
   Every search that is run is remembered on this phone — the list as it was
   typed, whether it was people or vehicles, how many lines, when — newest
   first, the same search never twice. The small arrow in the bar opens it; a
   line in it puts that list back in the box and runs it again. Locking the
   app from the home screen wipes it along with the key.
   ============================================================ */
const HIST_KEY = "ncm_multi_history", HIST_MAX = 40;
let HIST = [];
function histLoad(){
  HIST = [];
  try{
    const list = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
    // what comes off the disk is taken for nothing more than what it should be
    if(Array.isArray(list)) HIST = list.filter(x => x && typeof x.t === "string" && x.t).slice(0, HIST_MAX)
      .map(x => ({ m: x.m === "veh" ? "veh" : "ind", t: x.t.slice(0, 6000), n: +x.n || 0, f: +x.f || 0, at: +x.at || 0 }));
  }catch(e){ HIST = []; }
}
function histSave(){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(HIST)); }catch(e){} }
function histAdd(){
  const res = st.res;
  if(!res || !res.terms) return;
  const text = parseTerms(st.text).terms.join("\n").slice(0, 6000);
  HIST = HIST.filter(x => !(x.m === res.mode && x.t === text));
  HIST.unshift({ m: res.mode, t: text, n: res.terms, f: res.found, at: Date.now() });
  if(HIST.length > HIST_MAX) HIST.length = HIST_MAX;
  histSave();
}
function stamp(at){
  if(!at) return "";
  const d = new Date(at);
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function histHTML(){
  if(!HIST.length) return '<div class="hist-empty">' + esc(t("histEmpty")) + "</div>";
  return HIST.map((x, i) => {
    const terms = x.t.split("\n");
    return '<button type="button" class="hist-row" data-hist="' + i + '">' + pill(x.m === "veh" ? "link" : "white", t(x.m === "veh" ? "segVehicles" : "segPeople")) +
      '<span class="hist-t">' + esc(terms.slice(0, 2).join(" · ")) + (terms.length > 2 ? " <b>+" + (terms.length - 2) + "</b>" : "") + "</span>" +
      '<span class="hist-at num">' + esc(stamp(x.at)) + "</span></button>";
  }).join("") + '<button type="button" class="hist-clear" id="hist-clear">' + esc(t("histClear")) + "</button>";
}
function histToggle(open){
  const box = $("hist");
  if(open === undefined) open = box.hidden;
  if(open) box.innerHTML = histHTML();
  box.hidden = !open;
  $("hist-btn").classList.toggle("on", open);
  $("hist-btn").setAttribute("aria-expanded", open ? "true" : "false");
}
function histPick(i){
  const x = HIST[i];
  if(!x) return;
  setMode(x.m);
  $("mt").value = x.t;
  histToggle(false);
  goMulti();
}

/* Nothing of a search outlives the visit to this page: going back ends it, and
   coming in again finds the box empty (asked for so, 5 October 2026 - the page
   used to put the last list back). A list that is wanted again is one tap away
   in the history above. */
function startEmpty(){
  $("mt").value = ""; st.text = ""; st.res = null;
  setMode("ind"); multiLines(); paintMulti(); histToggle(false);
}
// a page the phone kept whole and shows again is cleared the same way
window.addEventListener("pageshow", e => { if(e.persisted) startEmpty(); });

/* ============================================================
   WIRING
   ============================================================ */
function setMode(mode){
  st.mode = mode === "veh" ? "veh" : "ind";
  [].forEach.call(document.querySelectorAll("#seg button"), b => b.classList.toggle("on", b.dataset.mmode === st.mode));
  const veh = st.mode === "veh";
  $("mt").setAttribute("aria-label", t(veh ? "ariaPlates" : "ariaNids"));
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = "rtl";            // right-to-left in both languages, as the permits system is
  $("pagename").textContent = t("page");
  const seg = document.querySelectorAll("#seg button");
  seg[0].textContent = t("segPeople"); seg[1].textContent = t("segVehicles");
  $("go").textContent = t("search"); $("clear").textContent = t("clear");
  $("refresh").setAttribute("aria-label", t("refresh")); $("refresh").title = t("refresh");
  $("hist-btn").setAttribute("aria-label", t("histAria")); $("hist-btn").title = t("histAria");
  setMode(st.mode); multiLines(); paintSrc();
}
$("seg").addEventListener("click", e => {
  const b = e.target.closest("[data-mmode]");
  if(!b || b.dataset.mmode === st.mode) return;
  setMode(b.dataset.mmode);
  // the same list, asked of the other sheet — if a list has been asked at all
  if(st.res){ st.text = $("mt").value; runMulti(); paintMulti(); }
});
$("mt").addEventListener("input", multiLines);
$("go").addEventListener("click", () => { $("mt").blur(); histToggle(false); goMulti(); });
$("clear").addEventListener("click", () => {
  $("mt").value = ""; st.text = ""; st.res = null;
  multiLines(); paintMulti(); histToggle(false);
  $("mt").focus();
});
$("hist-btn").addEventListener("click", () => histToggle());
$("hist").addEventListener("click", e => {
  if(e.target.closest("#hist-clear")){ HIST = []; histSave(); return histToggle(true); }
  const row = e.target.closest("[data-hist]");
  if(row) histPick(+row.dataset.hist);
});
let refreshing = false;
$("refresh").addEventListener("click", () => {
  if(refreshing) return;
  refreshing = true;
  $("refresh").classList.add("spin");
  loadAll().finally(() => { refreshing = false; $("refresh").classList.remove("spin"); });
});

/* ============================================================
   BOOT
   The shell at the app root owns the PIN. Arriving here without the unsealed
   key means this device was never let in, or the unlock was revoked, so the
   page hands the visitor back to the door.
   ============================================================ */
function storedKey(){
  // The cookie survives the storage sweeps that wipe localStorage, and the
  // other way round; either one alone is enough to stay unlocked.
  let flag = null;
  try{ flag = localStorage.getItem(UNLOCK_KEY); }catch(e){}
  if(!flag){
    const hit = document.cookie.split("; ").find(c => c.startsWith(UNLOCK_KEY + "="));
    flag = hit ? decodeURIComponent(hit.slice(UNLOCK_KEY.length + 1)) : null;
  }
  if(flag !== ACCESS_VERSION) return null;
  try{ return localStorage.getItem(AUTH_KEY); }catch(e){ return null; }
}
const key = storedKey();
if(!key){
  location.replace("../");
}else{
  sb = supabase.createClient(SUPABASE_URL, key);
  histLoad();
  try{ sessionStorage.removeItem("ncm_multi_last"); }catch(e){}   // what an older version of the page left behind
  applyLang();
  paintMulti();
  loadAll();
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("../service-worker.js").catch(() => {}));
}
