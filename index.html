<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بحث التصاريح</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#0e0c08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0e0c08;
    --bg-elev:#1c170f;
    --line:#3a2f1c;
    --ink:#f7f1e3;
    --ink-dim:#c9b98f;
    --brand:#e0a63a;
    --brand-dim:#3a2c10;
    --success:#3fae6f;
    --success-dim:#173b26;
    --amber:#e2a12b;
    --amber-dim:#3a2e12;
    --red:#e0554a;
    --red-dim:#3a1a17;
    --gray:#a89a78;
    --gray-dim:#2a2417;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1000px 550px at 15% -10%, rgba(224,166,58,0.16) 0%, transparent 55%),
      radial-gradient(900px 500px at 95% 5%, rgba(224,120,40,0.14) 0%, transparent 55%),
      radial-gradient(1300px 700px at 50% 105%, #000000 0%, transparent 65%),
      linear-gradient(160deg, #1c170f 0%, #120f0a 55%, #060504 100%);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
  }
  .logo{
    display:inline-block;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    padding:12px 26px;
    border-radius:20px;
    background:linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02));
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    border:1px solid rgba(255,255,255,0.28);
    box-shadow:
      0 8px 28px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -12px 20px -10px rgba(0,0,0,0.25);
    max-width:90vw;
  }
  .logo span{
    background:linear-gradient(180deg, #f7e3ad 0%, #e0a63a 45%, #a8721f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,0.15);
  }
  header h1{
    margin:14px 0 0;
    font-size:20px;
    font-weight:700;
    color:var(--ink-dim);
  }
  .search-wrap{
    padding:0 20px 14px;
    max-width:520px;
    margin:0 auto;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:16px;
    padding:14px 16px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .search-box svg{flex:none;opacity:.7;}
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    font-size:17px;
    font-weight:500;
  }
  .search-box input::placeholder{color:var(--ink-dim);}
  .hint{
    color:var(--ink-dim);
    font-size:12.5px;
    padding:10px 4px 0;
    text-align:center;
  }
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    overflow-x:auto;
  }
  .tab-btn{
    flex:1;
    white-space:nowrap;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--ink-dim);
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 10px;
    border-radius:12px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--brand-dim);
    color:var(--brand);
    border-color:rgba(31,174,122,0.4);
  }
  .refresh-btn{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--brand);
    cursor:pointer;
  }
  .refresh-btn.spinning svg{
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  main{max-width:520px;margin:0 auto;padding:6px 20px 60px;}
  .list-summary{
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:4px 0 4px;
  }
  .msg{
    text-align:center;
    color:var(--ink-dim);
    padding:40px 10px;
    font-size:14.5px;
    line-height:1.9;
  }
  .card{
    background:linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:18px;
    padding:18px;
    margin-top:14px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .photos-row{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .photo{
    width:100%;
    max-width:320px;
    height:auto;
    border-radius:14px;
    background:var(--gray-dim);
    object-fit:contain;
    border:1px solid var(--line);
  }
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
  .info .name{font-size:17px;font-weight:700;margin:0 0 2px;}
  .info .job{color:var(--ink-dim);font-size:13.5px;margin:0 0 10px;}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:999px;
    font-size:13px;font-weight:700;
    align-self:flex-start;
  }
  .badge.ok{background:var(--success-dim);color:var(--success);}
  .badge.warn{background:var(--amber-dim);color:var(--amber);}
  .badge.bad{background:var(--red-dim);color:var(--red);}
  .badge.mute{background:var(--gray-dim);color:var(--gray);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .expiry-block{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:10px 14px;
    border-radius:12px;
    background:var(--gray-dim);
  }
  .expiry-block.ok{background:var(--success-dim);}
  .expiry-block.warn{background:var(--amber-dim);}
  .expiry-block.bad{background:var(--red-dim);}
  .expiry-label{
    font-size:12px;
    color:var(--ink-dim);
    font-weight:500;
  }
  .expiry-date{
    font-size:26px;
    font-weight:900;
    letter-spacing:.5px;
    color:var(--brand);
  }
  .expiry-block.ok .expiry-date{color:var(--success);}
  .expiry-block.warn .expiry-date{color:var(--amber);}
  .expiry-block.bad .expiry-date{color:var(--red);}
  .expiry-block.mute .expiry-date{color:var(--gray);}
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:12px;
    padding:11px 14px;
  }
  .field .row-label{
    font-size:12.5px;
    color:var(--ink-dim);
    white-space:nowrap;
    font-weight:500;
  }
  .field b{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    text-align:left;
  }
  .field.field-name b{
    font-size:18px;
    font-weight:800;
  }
  .rows{display:grid;gap:6px;font-size:13.5px;color:var(--ink-dim);}
  .rows b{color:var(--ink);font-weight:500;}
  .row-label{color:var(--ink-dim);}
  footer{
    text-align:center;color:var(--ink-dim);font-size:11.5px;
    padding:20px;opacity:.6;
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>NCM Permission</span></div>
  <h1>بحث</h1>
</header>

<div class="search-wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="search">بحث</button>
    <button class="tab-btn" data-tab="banned">الممنوعين</button>
    <button class="tab-btn" data-tab="expiring">قرب الانتهاء</button>
    <button id="refresh-btn" class="refresh-btn" title="تحديث البيانات" aria-label="تحديث البيانات">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 15a8 8 0 0 0 13.9 3.2M18.5 9A8 8 0 0 0 4.6 5.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="search-tab">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9fb7c8" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="#9fb7c8" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="اكتب الكود، الرقم القومي، أو الاسم..." autocomplete="off" inputmode="search">
    </div>
    <div class="hint" id="hint">ابحث بأي من الثلاثة: كود الموظف، الرقم القومي، أو الاسم</div>
  </div>
</div>

<main>
  <div id="results"></div>
</main>

<footer>نظام بحث التصاريح · للاستخدام الداخلي</footer>

<script>
// ---- إعدادات الاتصال بـ Supabase ----
const SUPABASE_URL = "https://ljcalgumlodehoulbwtp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqY2FsZ3VtbG9kZWhvdWxid3RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDU4OTgsImV4cCI6MjEwMDkyMTg5OH0.RD3ZfSdrAEIYyhJqeQazAQ6JHhk9ji_ZfUrSHXE-RuE";
const PHOTO_BUCKET = "employee-photos";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const qInput = document.getElementById('q');
const resultsEl = document.getElementById('results');
const hintEl = document.getElementById('hint');
const searchTabEl = document.getElementById('search-tab');
const tabButtons = document.querySelectorAll('.tab-btn');
const refreshBtn = document.getElementById('refresh-btn');

let debounceTimer = null;
let currentTab = 'search';

function refreshCurrentView() {
  refreshBtn.classList.add('spinning');
  const done = () => refreshBtn.classList.remove('spinning');

  if (currentTab === 'search') {
    const term = qInput.value.trim();
    if (term) {
      Promise.resolve(runSearch(term)).finally(done);
    } else {
      done();
    }
  } else if (currentTab === 'banned') {
    Promise.resolve(loadBannedList()).finally(done);
  } else if (currentTab === 'expiring') {
    Promise.resolve(loadExpiringList()).finally(done);
  } else {
    done();
  }
}

refreshBtn.addEventListener('click', refreshCurrentView);


tabButtons.forEach((btn) => {
  btn.addEventListener('click', () => {
    tabButtons.forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    resultsEl.innerHTML = '';

    if (currentTab === 'search') {
      searchTabEl.style.display = 'block';
      hintEl.style.display = qInput.value.trim() ? 'none' : 'block';
      if (qInput.value.trim()) runSearch(qInput.value.trim());
    } else if (currentTab === 'banned') {
      searchTabEl.style.display = 'none';
      loadBannedList();
    } else if (currentTab === 'expiring') {
      searchTabEl.style.display = 'none';
      loadExpiringList();
    }
  });
});

qInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const term = qInput.value.trim();
  if (term.length < 1) {
    resultsEl.innerHTML = '';
    hintEl.style.display = 'block';
    return;
  }
  hintEl.style.display = 'none';
  debounceTimer = setTimeout(() => runSearch(term), 300);
});

async function loadBannedList() {
  resultsEl.innerHTML = `<div class="msg">جارِ التحميل...</div>`;
  const { data, error } = await sb
    .from('employees')
    .select('*')
    .eq('permit_status', 'ممنوع')
    .order('emp_code', { ascending: true });

  if (error) {
    resultsEl.innerHTML = `<div class="msg">حصل خطأ في الاتصال بالبيانات.<br>${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    resultsEl.innerHTML = `<div class="msg">لا يوجد أشخاص ممنوعين حاليًا.</div>`;
    return;
  }
  resultsEl.innerHTML =
    `<div class="list-summary">عدد الممنوعين: ${data.length}</div>` +
    data.map(renderCard).join('');
}

async function loadExpiringList() {
  resultsEl.innerHTML = `<div class="msg">جارِ التحميل...</div>`;
  const today = new Date();
  const in30 = new Date(today.getTime() + 30 * 86400000);
  const todayIso = today.toISOString().slice(0, 10);
  const in30Iso = in30.toISOString().slice(0, 10);

  const { data, error } = await sb
    .from('employees')
    .select('*')
    .eq('permit_status', 'ساري')
    .gte('permit_date', todayIso)
    .lte('permit_date', in30Iso)
    .order('permit_date', { ascending: true });

  if (error) {
    resultsEl.innerHTML = `<div class="msg">حصل خطأ في الاتصال بالبيانات.<br>${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    resultsEl.innerHTML = `<div class="msg">لا يوجد تصاريح قربت تنتهي خلال الشهر القادم.</div>`;
    return;
  }
  resultsEl.innerHTML =
    `<div class="list-summary">عدد التصاريح القريبة من الانتهاء: ${data.length}</div>` +
    data.map(renderCard).join('');
}

async function runSearch(term) {
  resultsEl.innerHTML = `<div class="msg">جارِ البحث...</div>`;

  const isNumeric = /^[0-9]+$/.test(term);
  let query = sb.from('employees').select('*');

  if (isNumeric) {
    // Numbers must match the code or national ID EXACTLY — no partial/substring hits.
    query = query.or(`emp_code.eq.${term},national_id.eq.${term}`);
  } else {
    // Text search still matches within the name, since typing a full name isn't practical.
    query = query.ilike('full_name', `%${term}%`);
  }

  const { data, error } = await query.limit(25);

  if (error) {
    resultsEl.innerHTML = `<div class="msg">حصل خطأ في الاتصال بالبيانات.<br>${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    resultsEl.innerHTML = `<div class="msg">لا يوجد موظف مطابق لهذا البحث.</div>`;
    return;
  }
  resultsEl.innerHTML = data.map(renderCard).join('');
}

function formatDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
}

function statusInfo(emp) {
  const today = new Date();
  let cls = 'mute', label = emp.permit_status || 'غير محدد';
  const dateStr = formatDate(emp.permit_date);

  if (emp.permit_status === 'ساري' && emp.permit_date) {
    const d = new Date(emp.permit_date);
    const daysLeft = Math.ceil((d - today) / 86400000);
    if (daysLeft <= 30) {
      cls = 'warn'; label = `قرب الانتهاء (${daysLeft} يوم)`;
    } else {
      cls = 'ok'; label = 'ساري';
    }
  } else if (emp.permit_status === 'منتهي الصلاحية') {
    cls = 'bad'; label = 'تصريح منتهي';
  } else if (emp.permit_status === 'ممنوع') {
    cls = 'bad'; label = 'ممنوع';
  } else if (emp.permit_status === 'بدون تصريح') {
    cls = 'mute'; label = 'بدون تصريح';
  }
  return { cls, label };
}

function formatDateNumeric(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function renderCard(emp) {
  const { cls, label } = statusInfo(emp);
  const photoUrl1 = emp.emp_code
    ? `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${emp.emp_code}.jpg`
    : '';
  const photoUrl2 = emp.emp_code
    ? `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${emp.emp_code}_2.jpg`
    : '';
  const catLabel = emp.category === 'blue' ? 'BLUE COLLAR' : 'WHITE COLLAR';

  return `
    <div class="card">
      <div class="info">
        ${emp.permit_date ? `
        <div class="expiry-block ${cls}">
          <span class="expiry-label">تاريخ انتهاء التصريح</span>
          <span class="expiry-date">${formatDateNumeric(emp.permit_date)}</span>
        </div>` : `
        <div class="expiry-block ${cls}">
          <span class="expiry-label">حالة التصريح</span>
          <span class="expiry-date">${label}</span>
        </div>`}
        <div class="field field-name">
          <span class="row-label">الاسم</span>
          <b>${escHtml(emp.full_name || '-')}</b>
        </div>
        <div class="field">
          <span class="row-label">الكود</span>
          <b>${escHtml(emp.emp_code ?? '-')}</b>
        </div>
        <div class="field">
          <span class="row-label">الرقم القومي</span>
          <b>${escHtml(emp.national_id ?? '-')}</b>
        </div>
        <div class="field">
          <span class="row-label">الوظيفة</span>
          <b>${escHtml(emp.job_title || '-')}</b>
        </div>
        <div class="field">
          <span class="row-label">النوع</span>
          <b>${catLabel}</b>
        </div>
        ${emp.department ? `
        <div class="field">
          <span class="row-label">القسم</span>
          <b>${escHtml(emp.department)}</b>
        </div>` : ''}
        <div class="field">
          <span class="row-label">العنوان</span>
          <b>${escHtml(emp.address ?? '-')}</b>
        </div>
        <span class="badge ${cls}"><span class="dot"></span>${label}</span>
        ${emp.ban_reason ? `
        <div class="field">
          <span class="row-label">سبب المنع</span>
          <b>${escHtml(emp.ban_reason)}</b>
        </div>` : ''}
        ${emp.notes ? `
        <div class="field">
          <span class="row-label">ملاحظات</span>
          <b>${escHtml(emp.notes)}</b>
        </div>` : ''}
      </div>
      <div class="photos-row">
        <img class="photo" src="${photoUrl1}" onerror="this.src='data:image/svg+xml;utf8,${placeholderSvg()}'">
        <img class="photo" src="${photoUrl2}" onerror="this.src='data:image/svg+xml;utf8,${placeholderSvg()}'">
      </div>
    </div>`;
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function placeholderSvg() {
  return encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 74 74'><rect width='74' height='74' rx='14' fill='%2322303a'/><circle cx='37' cy='29' r='12' fill='%237c8b96'/><path d='M15 62c3-13 14-20 22-20s19 7 22 20' fill='%237c8b96'/></svg>`);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
