<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCM PERMISSION</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#edf2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   The home screen borrows the two systems' shared design tokens
   so the door and the rooms behind it read as one building.
   ============================================================ */
:root{
  --bg:#edf2f8;
  --panel:#ffffff;
  --panel-2:#f3f7fb;
  --gold:#1565c0;
  --tint:#e6eef8;
  --brand-green:#4ba548;
  --brand-blue:#1565c0;
  --brand-navy:#1f4e79;
  --brand-grey:#5a646c;
  --danger:#c22f2f;
  --text:#0b1114;
  --muted:#474d54;
  --line:#e2e9f2;
  --line-2:#c0d3ec;
  --r:14px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cond:'Barlow Condensed',sans-serif;
  --sans:'Tajawal',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{
  min-height:100dvh;background-color:var(--bg);
  background-image:radial-gradient(900px 460px at 50% -10%, rgba(21,101,192,.07) 0%, transparent 62%);
  background-repeat:no-repeat;background-attachment:fixed;
}
body{
  background:transparent;color:var(--text);font-family:var(--sans);
  min-height:100dvh;-webkit-font-smoothing:antialiased;
  /* Tajawal swaps digits to Arabic-Indic forms while the page language is
     Arabic; turning off the localised forms keeps every number Western. */
  font-feature-settings:"locl" 0;
  font-variant-numeric:lining-nums;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}

/* ---------- language switch ---------- */
.langbtn{
  flex:none;display:flex;align-items:center;gap:6px;padding:9px 12px;
  border-radius:999px;border:1px solid var(--line-2);
  background:var(--tint);color:var(--gold);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .16s,transform .12s;
}
.langbtn:hover{background:#d9e6f7;}
.langbtn:active{transform:scale(.94);}
.langbtn svg{flex:none;}
.langbtn span{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.1em;line-height:1;}

/* ---------- brand lockup ---------- */
.brand{display:flex;flex-direction:column;align-items:center;line-height:1;}
.ncm{
  font-family:var(--sans),'Arial Black',system-ui;
  font-weight:900;font-size:36px;line-height:1;color:var(--brand-blue);
  /* one directional run, so the letters cannot be reordered in Arabic */
  direction:ltr;unicode-bidi:isolate;
}
.ncm i{font-style:normal;color:var(--brand-green);}
.ncm b{font-weight:inherit;color:var(--brand-grey);}
.tagline{
  font-size:11.5px;letter-spacing:.17em;text-indent:.17em;
  color:var(--brand-navy);margin-top:11px;direction:ltr;unicode-bidi:isolate;
}
.brand .hr{
  display:block;width:46px;height:1px;margin:12px auto 10px;
  background:linear-gradient(90deg,transparent,var(--line-2),transparent);
}
.appname{
  font-family:var(--cond);font-weight:700;font-size:20px;
  letter-spacing:.13em;text-indent:.13em;line-height:1;color:var(--gold);
}
.brand.sm .ncm{font-size:31px;}
.brand.sm .appname{font-size:18px;}

/* ============================================================
   GATE — one PIN for both systems. The database key is sealed
   inside VAULT with that PIN, so a wrong code does not merely
   hide rows: neither system can reach its data at all.
   ============================================================ */
#gate{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  background:radial-gradient(560px 380px at 50% 30%, rgba(21,101,192,.07) 0%, transparent 70%), var(--bg);
}
.gate-card{
  width:100%;max-width:328px;text-align:center;
  border:1px solid var(--line);border-radius:20px;
  background:var(--panel);padding:38px 28px 30px;
  box-shadow:0 8px 26px rgba(21,101,192,.10);
}
#pin{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}

/* One box per digit, and nothing above them: four empty boxes under the mark
   say "type the code" without a caption having to. The real input is the
   hidden field above — tapping anywhere on the row focuses it, which keeps the
   phone's own keyboard in charge instead of four separate fields fighting over
   it. */
/* Forced LTR: a number is written left to right in both languages, so the
   first digit typed has to land in the leftmost box. Left to the page's own
   direction, an Arabic reading fills the row backwards and 1804 comes out
   4081. */
.pinboxes{display:flex;justify-content:center;gap:11px;cursor:text;direction:ltr;margin-top:30px;}
.pinboxes i{
  width:52px;height:62px;border-radius:15px;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line-2);background:var(--panel-2);
  font-family:var(--mono);font-size:25px;font-weight:600;color:var(--text);
  transition:border-color .16s,background .16s,box-shadow .16s;
}
.pinboxes i.on{border-color:var(--gold);background:var(--panel);}
/* the box waiting for the next digit, so the row shows where you are */
.pinboxes.focus i.next{border-color:var(--gold);box-shadow:0 0 0 3px rgba(21,101,192,.13);}
@media (max-width:339px){
  .pinboxes{gap:8px;}
  .pinboxes i{width:46px;height:56px;font-size:22px;}
}
.gate-err{color:var(--danger);font-size:13px;min-height:20px;margin:16px 0 0;font-weight:700;}
.gate-err.busy{color:var(--muted);}
.shake{animation:shake .36s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

/* ============================================================
   HOME — the two doors
   ============================================================ */
#home{
  min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(26px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));
}
/* Forced LTR so the language button keeps its corner whichever way the text
   runs — the same fix both systems make for their own toolbars. */
.home-top{
  display:flex;align-items:center;direction:ltr;
  max-width:600px;width:100%;margin:0 auto 22px;
}

/* There is no lock button on this screen on purpose. A guard who taps one by
   accident is locked out of an app whose PIN he was never given. Locking is a
   deliberate act instead: hold the mark for a second and a half. */
.home-brand{margin:6px auto 4px;cursor:default;user-select:none;-webkit-user-select:none;}
.home-brand.locking{opacity:.45;transition:opacity 1.4s linear;}
.doors{
  display:flex;flex-direction:column;gap:16px;
  width:100%;max-width:480px;margin:34px auto 0;
}
/* Each card carries the whole of its system's colour — the logo's own blue for
   the staff, its own green for the permits — so the two are told apart before
   a word is read. The shadow is tinted with the same colour rather than grey,
   which keeps the card sitting on the page instead of cut out of it. */
.door{
  display:block;text-align:center;text-decoration:none;
  padding:34px 22px;border-radius:22px;
  background:var(--accent);color:#fff;
  box-shadow:0 10px 26px var(--accent-shadow);
  transition:transform .14s,box-shadow .2s,filter .16s;
}
.door:hover{box-shadow:0 16px 38px var(--accent-shadow);filter:brightness(1.06);}
.door:active{transform:scale(.985);}
#door-emp{--accent:#1565c0;--accent-shadow:rgba(21,101,192,.34);}
#door-per{--accent:#4ba548;--accent-shadow:rgba(75,165,72,.34);}

/* The mark carries the logo's own three colours, so it needs a light ground to
   sit on: the N's blue would vanish into the blue card and the C's green into
   the green one. A white plate gives it that, and it reads as the company's
   mark rather than a word recoloured to fit.

   It also settles the word order. "موظفين NCM" and "NCM Employees" put the
   mark on opposite ends; stacking it above the word means neither language
   moves anything. */
.door-mark{
  display:inline-flex;align-items:center;justify-content:center;
  padding:9px 17px;border-radius:13px;background:#fff;margin-bottom:15px;
  box-shadow:0 3px 10px rgba(11,17,20,.12);
}
.door-mark .ncm{font-size:25px;}
.door-title{
  display:block;font-weight:800;font-size:21px;line-height:1.35;color:#fff;
}
@media (max-width:339px){
  .door{padding:29px 18px;}
  .door-mark .ncm{font-size:22px;}
  .door-title{font-size:19px;}
}

/* ---------- credit ----------
   Always English, whichever language the interface is in: a name is not
   translated, and it reads the same on every screen it appears on. */
.credit{
  margin-top:auto;padding-top:30px;text-align:center;
  direction:ltr;line-height:1.55;
}
/* The gate card is a plain block, so there is no free space for margin-top:auto
   to eat; the signature just sits under the error line. */
.gate-card .credit{margin-top:0;padding-top:24px;}
.credit-by{
  display:block;font-size:9px;letter-spacing:.24em;text-indent:.24em;
  text-transform:uppercase;color:var(--brand-green);opacity:.722;
}
.credit-name{
  display:inline-block;margin-top:7px;padding:7px 15px;
  border-radius:999px;background:var(--tint);border:1px solid var(--line-2);
  font-family:var(--cond);font-weight:700;font-size:12.5px;
  letter-spacing:.19em;text-indent:.19em;color:var(--brand-blue);
}

@media (min-width:620px){
  .ncm{font-size:40px;}
  .appname{font-size:22px;}
}
</style>
</head>
<body>

<!-- ================= GATE ================= -->
<div id="gate" role="dialog" aria-modal="true" aria-label="شاشة الدخول">
  <div class="gate-card">
    <div class="brand sm">
      <span class="ncm">N<i>C</i><b>M</b></span>
      <span class="tagline">NUCLEAR CONCRETE MIXES</span>
      <span class="hr"></span>
      <span class="appname">PERMISSION</span>
    </div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="الرقم السري">
    <div class="pinboxes" id="pinboxes" role="button" tabindex="0" aria-label="اضغط لإدخال الرقم">
      <i></i><i></i><i></i><i></i>
    </div>
    <p class="gate-err" id="gate-err" role="alert" aria-live="assertive"></p>
    <p class="credit">
      <span class="credit-by">Designed by</span>
      <span class="credit-name">KHALED SABRY</span>
    </p>
  </div>
</div>

<!-- ================= HOME ================= -->
<div id="home" hidden>
  <div class="home-top">
    <button class="langbtn" id="lang-home" type="button" aria-label="Switch language">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 9.5h17M3.5 14.5h17" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.4c2.2 2.4 3.3 5.3 3.3 8.6s-1.1 6.2-3.3 8.6c-2.2-2.4-3.3-5.3-3.3-8.6S9.8 5.8 12 3.4z" stroke="currentColor" stroke-width="1.5"/></svg>
      <span class="lang-t">EN</span>
    </button>
  </div>

  <div class="brand home-brand" id="home-brand">
    <span class="ncm">N<i>C</i><b>M</b></span>
    <span class="tagline">NUCLEAR CONCRETE MIXES</span>
    <span class="hr"></span>
    <span class="appname">PERMISSION</span>
  </div>

  <div class="doors">
    <a class="door" href="./employees/" id="door-emp">
      <span class="door-mark" aria-hidden="true"><span class="ncm">N<i>C</i><b>M</b></span></span>
      <span class="door-title" id="emp-title">موظفين</span>
    </a>

    <a class="door" href="./permits/" id="door-per">
      <span class="door-mark" aria-hidden="true"><span class="ncm">N<i>C</i><b>M</b></span></span>
      <span class="door-title" id="per-title">تصاريح</span>
    </a>
  </div>

  <p class="credit">
    <span class="credit-by">Designed by</span>
    <span class="credit-name">KHALED SABRY</span>
  </p>
</div>

<script>
"use strict";

/* ============================================================
   ACCESS
   Bump ACCESS_VERSION to lock every device that is already
   unlocked: the stored version stops matching, the cached key is
   wiped, and everyone is asked for the PIN again. Bump CACHE in
   service-worker.js in the same commit, otherwise devices keep
   serving the cached page and never see it.
   ============================================================ */
const ACCESS_VERSION = "3";
const UNLOCK_KEY = "ncm_device_unlocked";   // holds the access version, never the PIN
const AUTH_KEY   = "ncm_key";               // holds the decrypted API key

/* Both systems live one folder below this page, and the unlock cookie has to
   be readable from either of them, so it is scoped to this folder rather than
   to whichever one happened to write it. */
const APP_ROOT = location.pathname.replace(/[^/]*$/, "");

/* The database key is NOT stored in this file. It is sealed with the PIN
   (PBKDF2-SHA256, 300k iterations -> AES-256-GCM). A wrong PIN fails to
   decrypt, so the employees system cannot reach the database at all — not
   "reaches it and hides the rows". Changing the PIN means re-sealing this
   blob; it is not enough to change a number in the code. */
const VAULT = {
  salt: "1ZNV5xAf3NZ1xK1iZmAnSA==",
  iv:   "8Fn1FfSAB6PgT89a",
  data: "WnVezfySqOjP/as8v7Qy1gBat4ogZnEmLwVjm8EgGDw3t8z1caZC5iFs9pQCsU1aeLDQoYcwCPgINotqnOhlT1d1rvn7iZLC2LvidByLEBK0bt7Ol3Q6xpSxOc14s6YBGB85mstlpbzbUSub8ZE5V2UW5n+e+HQJfSzFxHyZO+Ku43kMV2mGc38T9eM39HN+m5jh3jIoHVFk86jnCrFYpwidRzLKaO47k1odbdxWj9xhCThjWIjPisB6bnNt+vgHmAG2NbvVT7xCrtVFgxrM/g8Opv/ltrR7p235EuJ3EQ4="
};
const KDF_ITERATIONS = 300000;

const $ = (id) => document.getElementById(id);

/* ============================================================
   LANGUAGE — shares the key both systems already read, so the
   choice made here carries into whichever one is opened.
   ============================================================ */
const LANG_KEY = "ncm_lang";
const I18N = {
  ar:{
    dir:'rtl', htmlLang:'ar', other:'EN',
    gateAria:'شاشة الدخول', pinLabel:'الرقم السري', pinAria:'اضغط لإدخال الرقم',
    checking:'جارٍ التحقق', wrongPin:'رمز غير صحيح',
    empTitle:'موظفين',
    perTitle:'تصاريح',
    lockConfirm:'قفل التطبيق؟ هيطلب الرقم السري تاني على الجهاز ده.'
  },
  en:{
    dir:'ltr', htmlLang:'en', other:'AR',
    gateAria:'Login screen', pinLabel:'PIN Code', pinAria:'Tap to enter the PIN',
    checking:'Checking', wrongPin:'Incorrect PIN',
    empTitle:'Employees',
    perTitle:'Permits',
    lockConfirm:'Lock the app? This device will be asked for the PIN again.'
  }
};
let lang = 'ar';
try { const saved = localStorage.getItem(LANG_KEY); if(saved === 'en' || saved === 'ar') lang = saved; } catch(e){}
function t(k){ const v = I18N[lang][k]; return v === undefined ? I18N.ar[k] : v; }

function applyLang(){
  const L = I18N[lang];
  document.documentElement.lang = L.htmlLang;
  document.documentElement.dir  = L.dir;
  [].forEach.call(document.querySelectorAll('.lang-t'), el => el.textContent = L.other);
  $('gate').setAttribute('aria-label', t('gateAria'));
  $('pin').setAttribute('aria-label', t('pinLabel'));
  $('pinboxes').setAttribute('aria-label', t('pinAria'));
  $('emp-title').textContent = t('empTitle');
  $('per-title').textContent = t('perTitle');
}
function toggleLang(){
  lang = (lang === 'ar') ? 'en' : 'ar';
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyLang();
}
$('lang-home').addEventListener('click', toggleLang);

/* ============================================================
   UNLOCK FLAG
   Kept in two places on purpose. Phones evict localStorage on
   their own — Android reclaims site data under storage pressure,
   and the cleaner apps that ship on some handsets wipe it on a
   schedule — which is why the PIN kept coming back on a device
   that had already been unlocked. A cookie survives most of those
   sweeps, localStorage survives the ones that clear cookies.
   ============================================================ */
function readFlag(){
  let v = null;
  try{ v = localStorage.getItem(UNLOCK_KEY); }catch(e){}
  if(v) return v;
  const hit = document.cookie.split('; ').find(c => c.startsWith(UNLOCK_KEY + '='));
  return hit ? decodeURIComponent(hit.slice(UNLOCK_KEY.length + 1)) : null;
}
function writeFlag(){
  try{ localStorage.setItem(UNLOCK_KEY, ACCESS_VERSION); }catch(e){}
  // Ten years, scoped to this app's own folder on the shared github.io host.
  document.cookie = UNLOCK_KEY + '=' + ACCESS_VERSION +
    ';max-age=315360000;path=' + APP_ROOT + ';SameSite=Lax';
}
function clearFlag(){
  try{ localStorage.removeItem(UNLOCK_KEY); localStorage.removeItem(AUTH_KEY); }catch(e){}
  document.cookie = UNLOCK_KEY + '=;max-age=0;path=' + APP_ROOT;
  idbSet(null);
}

/* ============================================================
   A THIRD COPY OF THE KEY, IN INDEXEDDB
   The flag lives in a cookie as well as localStorage, but the sealed key can
   live in neither of those alone: a cookie is sent to the host on every single
   request, and localStorage is the first thing a phone drops when it is short
   of space. Losing the key means the PIN is asked for again on a device that
   was already set up — and only Khaled knows it, so that is a trip back to him
   every time. IndexedDB survives sweeps that clear the other two.
   ============================================================ */
const IDB_NAME = 'ncm_unlock', IDB_STORE = 'v';
function idbOpen(){
  return new Promise((resolve, reject) => {
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ return reject(e); }
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}
// Writing null clears the copy. Every failure is silent: this is a spare
// wheel, and an app that cannot open IndexedDB still works from localStorage.
async function idbSet(apiKey){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const st = tx.objectStore(IDB_STORE);
      if(apiKey === null){ st.delete('key'); st.delete('version'); }
      else { st.put(apiKey, 'key'); st.put(ACCESS_VERSION, 'version'); }
      tx.oncomplete = resolve;
      tx.onerror    = () => reject(tx.error);
    });
    db.close();
  }catch(e){}
}
async function idbGet(){
  try{
    const db = await idbOpen();
    const out = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const st = tx.objectStore(IDB_STORE);
      const k = st.get('key'), v = st.get('version');
      tx.oncomplete = () => resolve({key: k.result, version: v.result});
      tx.onerror    = () => reject(tx.error);
    });
    db.close();
    // A key sealed under a revoked access version is no key at all.
    return out.version === ACCESS_VERSION ? (out.key || null) : null;
  }catch(e){ return null; }
}

/* Ask the browser to hold on to this device's unlock. Without this, a phone
   that is low on space — or that has not opened the app for a while — may
   quietly evict the saved key, and the guard is asked for the PIN again for no
   reason he can see. Granted silently for an installed app. */
async function keepUnlockStored(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return false;
    if(await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch(e){ return false; }
}

/* ============================================================
   GATE
   ============================================================ */
const gate = $('gate'), home = $('home'), pin = $('pin');
const pinboxes = $('pinboxes'), gateErr = $('gate-err');

/* The digit itself never appears: a box fills with a dot the moment it is
   typed. The code is only ever entered while someone is standing there being
   handed the phone, and it is the one thing on this screen worth hiding. The
   box borders alone show how far along the entry is. */
function paintBoxes(){
  const n = pin.value.length;
  [].forEach.call(pinboxes.children, (b, i) => {
    b.classList.toggle('on', i < n);
    b.classList.toggle('next', i === n);
    b.textContent = i < n ? '•' : '';
  });
}
function openHome(){
  gate.style.display = 'none';
  home.hidden = false;
  pin.blur();          // the PIN is done; let the keyboard go
}
const b64d = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// Throws when the PIN is wrong: AES-GCM refuses to authenticate the blob.
async function unlockVault(entered){
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(entered), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(VAULT.salt), iterations:KDF_ITERATIONS, hash:'SHA-256'},
    material, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:b64d(VAULT.iv)}, key, b64d(VAULT.data));
  return new TextDecoder().decode(plain);
}

let unlocking = false;
async function submitPin(){
  if(unlocking || !pin.value) return;
  unlocking = true;
  gateErr.classList.add('busy');
  gateErr.textContent = t('checking');
  try{
    // 300k PBKDF2 rounds take a moment on a phone; the label says so.
    const apiKey = await unlockVault(pin.value);
    try { localStorage.setItem(AUTH_KEY, apiKey); } catch(e){}
    writeFlag();
    idbSet(apiKey);              // the spare copy, for when the phone sweeps
    keepUnlockStored();          // the PIN was entered once; keep it that way
    openHome();
  }catch(err){
    gateErr.classList.remove('busy');
    gateErr.textContent = t('wrongPin');
    const card = gate.querySelector('.gate-card');
    card.classList.add('shake');
    if(navigator.vibrate) navigator.vibrate(120);
    setTimeout(() => card.classList.remove('shake'), 400);
    pin.value = ''; paintBoxes(); pin.focus();
  }finally{
    unlocking = false;
  }
}
pinboxes.addEventListener('click', () => pin.focus());
pinboxes.addEventListener('keydown', e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); pin.focus(); }});
pin.addEventListener('input', () => {
  // Anything that is not a digit never reaches a box.
  pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
  gateErr.textContent = '';
  paintBoxes();
  if(pin.value.length === 4) submitPin();   // the fourth digit opens it
});
pin.addEventListener('focus', () => pinboxes.classList.add('focus'));
pin.addEventListener('blur',  () => pinboxes.classList.remove('focus'));
pin.addEventListener('keydown', e => { if(e.key==='Enter') submitPin(); });

/* Locking the app again is deliberate, not a button anyone can brush past:
   hold the mark for a second and a half, then confirm. A guard who never had
   the PIN cannot lock himself out by accident. */
(function(){
  const mark = $('home-brand');
  let timer = null;
  function start(){
    if(timer) return;
    mark.classList.add('locking');
    timer = setTimeout(() => {
      stop();
      if(navigator.vibrate) navigator.vibrate(60);
      if(confirm(t('lockConfirm'))){
        clearFlag();
        location.reload();
      }
    }, 1500);
  }
  function stop(){
    clearTimeout(timer); timer = null;
    mark.classList.remove('locking');
  }
  mark.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev => mark.addEventListener(ev, stop));
})();

/* ---------- boot ---------- */
applyLang();

/* A device stays unlocked only while it holds the current access version AND
   still has the sealed key: the flag alone opens nothing, because the
   employees system cannot query without the key.

   localStorage is checked first and synchronously, so a device that is simply
   fine goes straight to the two doors with no flash of the PIN screen. Only
   when that copy is gone — the case this whole dance exists for — is the
   IndexedDB spare consulted, and a brief flash there is a fair price for not
   sending the guard back to Khaled. */
function letIn(apiKey){
  try { localStorage.setItem(AUTH_KEY, apiKey); } catch(e){}
  writeFlag();                   // heal whichever copy was wiped
  idbSet(apiKey);
  keepUnlockStored();
  openHome();
}
function askForPin(){
  clearFlag();
  setTimeout(() => pin.focus(), 120);
}

if(readFlag() === ACCESS_VERSION){
  let storedKey = null;
  try { storedKey = localStorage.getItem(AUTH_KEY); } catch(e){}
  if(storedKey){
    letIn(storedKey);
  }else{
    idbGet().then(spare => { if(spare) letIn(spare); else askForPin(); });
  }
}else{
  /* The cookie may have outlived a wiped localStorage, or the version was
     revoked. Either way the spare is worth one look before asking. */
  idbGet().then(spare => { if(spare) letIn(spare); else askForPin(); });
}
paintBoxes();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
