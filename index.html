<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCM Permission</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#0b0a07">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#f6f0e2;
    --ink-2:#c3b491;
    --ink-3:#8b7d5e;
    --gold:#e0a63a;
    --gold-soft:#f2d79a;
    --edge:rgba(224,166,58,.22);
    --edge-2:rgba(255,255,255,.07);
    --ok:#3fae6f;
    --warn:#e2a12b;
    --bad:#e0554a;
    --mute:#8d8570;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{
    background-color:#0a0906;
    background-image:
      radial-gradient(900px 460px at 78% -6%, rgba(224,120,40,.13) 0%, transparent 58%),
      radial-gradient(760px 420px at 10% 2%, rgba(224,166,58,.10) 0%, transparent 55%);
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  body{
    background:transparent;
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100dvh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;}

  /* lock */
  #lock{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(178deg,#14110a 0%,#0b0906 60%,#050403 100%);
  }
  .lock-card{
    width:100%;max-width:330px;text-align:center;
    border:1px solid var(--edge);border-radius:20px;
    background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
    padding:34px 24px 26px;
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .brand{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:26px;line-height:1;
    background:linear-gradient(180deg,#fff8e6 0%,var(--gold) 58%,#9a6d18 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-rule{width:52px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .lock-sub{color:var(--ink-3);font-size:12.5px;letter-spacing:.03em;margin:14px 0 20px;}
  #pin{
    width:100%;text-align:center;letter-spacing:.7em;text-indent:.7em;
    font-family:'IBM Plex Mono',monospace;font-size:22px;
    padding:13px 10px;border-radius:12px;color:var(--ink);
    border:1px solid var(--edge-2);background:rgba(0,0,0,.35);transition:border-color .15s;
  }
  #pin:focus{outline:none;border-color:var(--gold);}
  #pin-go{
    width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;
    font-family:'Tajawal',sans-serif;font-weight:800;font-size:15px;color:#1a1204;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));cursor:pointer;
  }
  #pin-go:active{transform:translateY(1px);}
  #pin-err{color:var(--bad);font-size:12.5px;min-height:18px;margin:12px 0 0;}

  header{padding:26px 20px 6px;text-align:center;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}

  /* tabs */
  .bar{display:flex;gap:7px;margin:18px 0 12px;}
  .tab{
    flex:1;padding:11px 6px;border-radius:11px;cursor:pointer;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:13.5px;
    color:var(--ink-3);background:rgba(255,255,255,.035);
    border:1px solid var(--edge-2);transition:.16s;
  }
  .tab[aria-selected="true"]{color:#1a1204;border-color:transparent;background:linear-gradient(180deg,var(--gold-soft),var(--gold));}
  .icon-btn{
    flex:none;width:42px;border-radius:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);background:rgba(255,255,255,.035);border:1px solid var(--edge-2);
  }
  .icon-btn.busy svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* search */
  .field-search{
    display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:13px;
    background:rgba(0,0,0,.3);border:1px solid var(--edge-2);transition:border-color .15s;
  }
  .field-search:focus-within{border-color:var(--edge);}
  .field-search svg{flex:none;color:var(--ink-3);}
  #q{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-family:'Tajawal',sans-serif;font-size:16px;font-weight:500;}
  #q::placeholder{color:var(--ink-3);}

  .state{text-align:center;color:var(--ink-3);font-size:13.5px;padding:46px 12px;}
  .count{display:flex;align-items:center;gap:9px;margin:16px 2px 2px;color:var(--ink-3);font-size:11.5px;letter-spacing:.08em;}
  .count::after{content:"";flex:1;height:1px;background:var(--edge-2);}
  .count b{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-weight:600;}

  /* record */
  .rec{
    position:relative;margin-top:16px;border-radius:20px;
    border:1px solid rgba(255,255,255,.10);
    background:linear-gradient(168deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
    backdrop-filter:blur(18px) saturate(135%);
    -webkit-backdrop-filter:blur(18px) saturate(135%);
    box-shadow:0 18px 42px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.13);
    padding:18px 14px 16px;
    overflow:hidden;
  }
  /* status glow bleeding in from the top edge */
  .rec::after{
    content:"";position:absolute;top:0;left:0;right:0;height:110px;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 0%, var(--tone,transparent) 0%, transparent 70%);
    opacity:.16;
  }
  .rec[data-s="ok"]  {--tone:var(--ok);}
  .rec[data-s="warn"]{--tone:var(--warn);}
  .rec[data-s="bad"] {--tone:var(--bad);}
  .rec[data-s="mute"]{--tone:#8d8570;}

  .rec-head{
    position:relative;z-index:1;text-align:center;
    padding:16px 14px 15px;border-radius:15px;margin-bottom:9px;
    background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.018));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  }
  .rec-code{
    display:inline-flex;align-items:center;gap:7px;margin:0 0 11px;
    font-size:11px;font-weight:600;letter-spacing:.06em;
    color:var(--gold);background:rgba(224,166,58,.12);
    border:1px solid var(--edge);border-radius:999px;padding:4px 12px;
  }
  .rec-code-l{color:var(--ink-3);font-family:'Tajawal',sans-serif;font-weight:700;}
  .rec-code .num{font-size:12.5px;font-weight:600;}
  .rec-name{font-size:20px;font-weight:800;line-height:1.35;margin:0;color:#fff;}
  .rec-name-en{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.07em;
    font-size:14px;color:#fff;text-transform:uppercase;direction:ltr;
    margin:4px 0 0;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center;}
  .chip{
    font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;
    background:rgba(255,255,255,.06);color:var(--ink-2);border:1px solid rgba(255,255,255,.09);
  }
  .chip.tone{border-color:transparent;}
  .chip.ok{background:rgba(63,174,111,.16);color:var(--ok);}
  .chip.warn{background:rgba(226,161,43,.16);color:var(--warn);}
  .chip.bad{background:rgba(224,85,74,.17);color:var(--bad);}
  .chip.mute{background:rgba(141,133,112,.16);color:var(--mute);}

  /* permit — the loudest panel in the card */
  .permit{
    position:relative;z-index:1;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;border-radius:15px;margin-bottom:9px;
    background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.018));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  }
  .permit-l{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--ink);}
  .rec[data-s="ok"] .permit-l{color:var(--ok);}
  .rec[data-s="warn"] .permit-l{color:var(--warn);}
  .rec[data-s="bad"] .permit-l{color:var(--bad);}
  .rec[data-s="mute"] .permit-l{color:var(--mute);}
  .permit-v{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;letter-spacing:.01em;line-height:1;}
  .permit-v.small{font-family:'Tajawal',sans-serif;font-size:17px;font-weight:800;}
  .rec[data-s="ok"] .permit-v{color:var(--ok);}
  .rec[data-s="warn"] .permit-v{color:var(--warn);}
  .rec[data-s="bad"] .permit-v{color:var(--bad);}
  .rec[data-s="mute"] .permit-v{color:var(--mute);}
  .permit-note{font-size:11.5px;color:var(--ink-3);margin-top:5px;}

  /* every field is its own glass slab */
  .grid{position:relative;z-index:1;display:flex;flex-direction:column;gap:7px;margin:0;}
  .cell{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding:11px 15px;border-radius:13px;min-width:0;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
  }
  .cell dt{flex:none;font-size:11.5px;letter-spacing:.04em;color:var(--ink-3);margin:0;}
  .cell dd{margin:0;font-size:14px;font-weight:700;color:var(--ink);text-align:left;word-break:break-word;}
  .cell dd.num{font-size:14.5px;font-weight:500;letter-spacing:.02em;}
  .cell dd.warn{color:var(--warn);}
  .cell dd.bad{color:var(--bad);}

  .shots{position:relative;z-index:1;padding:9px 0 0;display:flex;flex-direction:column;gap:9px;}
  .shot{
    position:relative;border-radius:14px;overflow:hidden;
    border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);
  }
  .shot img{display:block;width:100%;height:auto;}
  .noshot{
    display:flex;align-items:center;justify-content:center;
    aspect-ratio:16/10;
    background:linear-gradient(160deg,#454545,#333333 60%,#2c2c2c);
    color:#fff;font-size:13.5px;font-weight:700;letter-spacing:.02em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
  }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <div class="brand">NCM Permission</div>
    <div class="brand-rule"></div>
    <p class="lock-sub">الرقم السري</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
    <button id="pin-go">دخول</button>
    <p id="pin-err"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">NCM Permission</div>
    <div class="brand-rule"></div>
  </header>

  <div class="wrap">
    <div class="bar" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="search">بحث</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="banned">الممنوعين</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="expiring">قرب الانتهاء</button>
      <button id="refresh" class="icon-btn" aria-label="تحديث">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 15a8 8 0 0 0 13.9 3.2M18.5 9A8 8 0 0 0 4.6 5.8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="searchbox">
      <div class="field-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="الكود · الرقم القومي · الاسم" autocomplete="off" inputmode="search">
      </div>
    </div>

    <div id="out"></div>
  </div>
</div>

<script>
const APP_PIN = "1804";
const AUTH_KEY = "ncm_authorized";
const SUPABASE_URL = "https://ljcalgumlodehoulbwtp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqY2FsZ3VtbG9kZWhvdWxid3RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDU4OTgsImV4cCI6MjEwMDkyMTg5OH0.RD3ZfSdrAEIYyhJqeQazAQ6JHhk9ji_ZfUrSHXE-RuE";
const BUCKET = "employee-photos";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const lock = $('lock'), app = $('app'), pin = $('pin'), pinErr = $('pin-err');
const q = $('q'), out = $('out'), searchbox = $('searchbox'), refresh = $('refresh');
const tabs = document.querySelectorAll('.tab');

function unlock(){ lock.style.display='none'; app.hidden=false; }
function tryPin(){
  if (pin.value === APP_PIN){ localStorage.setItem(AUTH_KEY,'1'); unlock(); }
  else { pinErr.textContent='رقم غير صحيح'; pin.value=''; pin.focus(); }
}
if (localStorage.getItem(AUTH_KEY)==='1') unlock(); else pin.focus();
$('pin-go').addEventListener('click', tryPin);
pin.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });

// Dates arrive as dd/mm/yyyy or yyyy-mm-dd depending on when the row was imported.
function parseDate(v){
  if(!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function fmtDate(v){
  const d = parseDate(v);
  if(!d) return null;
  const p = n => String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}
function daysLeft(v){
  const d = parseDate(v); if(!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t)/86400000);
}
function fmtPhone(v){
  if(!v) return null;
  let s = String(v).replace(/\D/g,'');
  if(!s) return null;
  if(s.length===10) s='0'+s;
  return s;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function status(emp){
  const st = emp.permit_status || '';
  if (st === 'ممنوع') return {k:'bad', label:'ممنوع'};
  if (st === 'ساري'){
    const dl = daysLeft(emp.permit_date);
    if (dl !== null && dl < 0)   return {k:'bad',  label:'تصريح منتهي'};
    if (dl !== null && dl <= 30) return {k:'warn', label:'قرب الانتهاء'};
    return {k:'ok', label:'ساري'};
  }
  if (st === 'منتهي الصلاحية') return {k:'bad', label:'تصريح منتهي'};
  return {k:'mute', label:'بدون تصريح'};
}

function shot(code, second){
  const url = SUPABASE_URL+'/storage/v1/object/public/'+BUCKET+'/'+code+(second?'_2':'')+'.jpg';
  return '<figure class="shot">'
    + '<img src="'+url+'" alt="" loading="lazy" onerror="this.closest(\'.shot\').innerHTML=\'<div class=&quot;noshot&quot;>لا يوجد صورة</div>\'">'
    + '</figure>';
}

function buildGrid(fields){
  return fields.filter(function(f){ return f.v; }).map(function(f){
    return '<div class="cell"><dt>'+f.k+'</dt><dd class="'+(f.cls||'')+'">'+esc(f.v)+'</dd></div>';
  }).join('');
}

function render(emp){
  const s = status(emp);
  const code = emp.emp_code == null ? '' : emp.emp_code;
  const resigned = !!emp.resignation_end_date;
  const cat = emp.category === 'blue' ? 'BLUE COLLAR' : emp.category === 'white' ? 'WHITE COLLAR' : null;
  const dl = daysLeft(emp.permit_date);
  const permitDate = fmtDate(emp.permit_date);

  const permitMain = permitDate
    ? '<div class="permit-v num">'+permitDate+'</div>'
    : '<div class="permit-v small">—</div>';
  const permitNote = (permitDate && dl !== null)
    ? '<div class="permit-note">'+(dl < 0 ? 'انتهى من ' + Math.abs(dl) + ' يوم' : 'باقي ' + dl + ' يوم على الانتهاء')+'</div>'
    : '';

  return '<article class="rec" data-s="'+s.k+'">'
    + '<div class="rec-head">'
      + '<span class="rec-code"><span class="rec-code-l">الكود</span><span class="num">'+esc(code)+'</span></span>'
      + '<h2 class="rec-name">'+esc(emp.full_name || '—')+'</h2>'
      + (emp.full_name_en ? '<p class="rec-name-en">'+esc(emp.full_name_en)+'</p>' : '')
      + '<div class="chips">'
        + '<span class="chip tone '+s.k+'">'+esc(s.label)+'</span>'
        + (resigned ? '<span class="chip tone bad">استقالة</span>' : '<span class="chip tone ok">موجود</span>')
        + (cat ? '<span class="chip">'+cat+'</span>' : '')
      + '</div>'
    + '</div>'
    + '<div class="permit">'
      + '<div><div class="permit-l">'+esc(s.label)+'</div>'+permitNote+'</div>'
      + permitMain
    + '</div>'
    + '<dl class="grid">' + buildGrid([
        {k:'الرقم القومي',     v:emp.national_id,                   cls:'num'},
        {k:'الوظيفة',          v:emp.job_title},
        {k:'القسم',            v:emp.department},
        {k:'العنوان',          v:emp.address},
        {k:'تاريخ التعيين',    v:fmtDate(emp.hire_date),            cls:'num'},
        {k:'رقم الهاتف',       v:fmtPhone(emp.phone),               cls:'num'},
        {k:'انتهاء الاستقالة', v:fmtDate(emp.resignation_end_date), cls:'num warn'},
        {k:'سبب المنع',        v:emp.ban_reason,                    cls:'bad'}
      ]) + '</dl>'
    + '<div class="shots">'+shot(code,false)+shot(code,true)+'</div>'
  + '</article>';
}

function show(rows, label){
  if(!rows || !rows.length){ out.innerHTML = '<p class="state">لا توجد نتائج</p>'; return; }
  const head = label ? '<div class="count">'+label+' <b>'+rows.length+'</b></div>' : '';
  out.innerHTML = head + rows.map(render).join('');
}
function loading(){ out.innerHTML = '<p class="state">جارٍ التحميل</p>'; }
function failed(m){ out.innerHTML = '<p class="state">تعذر تحميل البيانات — '+esc(m)+'</p>'; }

async function runSearch(term){
  loading();
  const digits = /^[0-9]+$/.test(term);
  let query = sb.from('employees').select('*');
  query = digits
    ? query.or('emp_code.eq.'+term+',national_id.eq.'+term)
    : query.or('full_name.ilike.%'+term+'%,full_name_en.ilike.%'+term+'%');
  const { data, error } = await query.limit(30);
  if (error) return failed(error.message);
  show(data, (data && data.length > 1) ? 'نتائج' : '');
}

async function loadBanned(){
  loading();
  // Resigned staff are no longer relevant to the gate, so only current employees show here.
  const { data, error } = await sb.from('employees').select('*')
    .eq('permit_status','ممنوع').order('emp_code');
  if (error) return failed(error.message);
  const current = (data || []).filter(function(r){ return !r.resignation_end_date; });
  show(current, 'ممنوعين');
}

async function loadExpiring(){
  loading();
  const { data, error } = await sb.from('employees').select('*').eq('permit_status','ساري');
  if (error) return failed(error.message);
  const soon = (data || [])
    .filter(function(r){ return !r.resignation_end_date; })
    .map(function(r){ return { r:r, d:daysLeft(r.permit_date) }; })
    .filter(function(x){ return x.d !== null && x.d >= 0 && x.d <= 30; })
    .sort(function(a,b){ return a.d - b.d; })
    .map(function(x){ return x.r; });
  show(soon, 'تنتهي خلال ٣٠ يوم');
}

let tab = 'search', timer = null;

function load(){
  if (tab === 'banned')   return loadBanned();
  if (tab === 'expiring') return loadExpiring();
  const t = q.value.trim();
  if (t) return runSearch(t);
  out.innerHTML = '';
  return Promise.resolve();
}

tabs.forEach(function(btn){
  btn.addEventListener('click', function(){
    tabs.forEach(function(b){ b.setAttribute('aria-selected', String(b === btn)); });
    tab = btn.dataset.tab;
    searchbox.hidden = tab !== 'search';
    out.innerHTML = '';
    load();
  });
});

q.addEventListener('input', function(){
  clearTimeout(timer);
  const t = q.value.trim();
  if(!t){ out.innerHTML=''; return; }
  timer = setTimeout(function(){ runSearch(t); }, 280);
});

refresh.addEventListener('click', function(){
  refresh.classList.add('busy');
  Promise.resolve(load()).finally(function(){ refresh.classList.remove('busy'); });
});

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js').catch(function(){});
  });
}
</script>
</body>
</html>
